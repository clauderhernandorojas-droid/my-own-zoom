    function connectSocketIfNeeded() {
      const token = getToken();
      if (!token) throw new Error("Sin token");
      if (socket?.connected) return Promise.resolve(socket);
      return new Promise((resolve, reject) => {
        socket = io({ auth: { token }, transports: ["websocket", "polling"] });
        socket.on("connect", () => resolve(socket));
        socket.on("connect_error", (e) => {
          const msg =
            String(e?.message || "").includes("UNAUTHORIZED") || e?.data === "UNAUTHORIZED"
              ? "Sesión inválida o caducada. Vuelve a iniciar sesión."
              : "No se pudo conectar al servidor: " + (e?.message || "error");
          log(msg);
          reject(new Error(msg));
        });
        socket.on("chat:message", appendChatLine);
        socket.on("board:state", (d) => mergeBoardContenido(d.contenido));
        socket.on("board:update", (d) => mergeBoardContenido(d.contenido));
        socket.on("board:follow:state", ({ active, roomId: rid }) => {
          if (!activeRoomId) return;
          if (active && rid && !sameActiveRoom(rid, activeRoomId)) return;
          boardFollowRoomActive = !!active;
          if (active) {
            if (isRoomDocente()) {
              presenterFollowLeadActive = true;
              emitPresenterViewImmediate();
            } else {
              savedBoardCamera = { boardPanX, boardPanY, boardZoom };
              followingPresenter = true;
              if (pendingPresenterView) {
                applyPresenterViewFromRemote(pendingPresenterView);
                pendingPresenterView = null;
              }
            }
          } else {
            presenterFollowLeadActive = false;
            if (followingPresenter && !isRoomDocente() && savedBoardCamera) {
              boardPanX = savedBoardCamera.boardPanX;
              boardPanY = savedBoardCamera.boardPanY;
              boardZoom = savedBoardCamera.boardZoom;
              syncZoomUi();
              drawBoard();
            }
            followingPresenter = false;
            savedBoardCamera = null;
            pendingPresenterView = null;
          }
          updateBoardFollowUi();
        });
        socket.on("board:view", (data) => {
          if (!data || !Number.isFinite(data.boardZoom)) return;
          const rid = data.roomId;
          if (rid && activeRoomId && !sameActiveRoom(rid, activeRoomId)) return;
          if (isRoomDocente()) return;
          const view = {
            boardPanX: data.boardPanX,
            boardPanY: data.boardPanY,
            boardZoom: data.boardZoom,
          };
          if (!boardFollowRoomActive) {
            pendingPresenterView = null;
            return;
          }
          if (!followingPresenter) {
            pendingPresenterView = view;
            return;
          }
          applyPresenterViewFromRemote(view);
        });
        socket.on("webrtc:offer", async ({ sdp, from }) => {
          try {
            await onIncomingOffer(from, sdp);
          } catch (e) { console.error(e); log("Error offer: " + e.message); }
        });
        socket.on("webrtc:answer", async ({ sdp, from }) => {
          try {
            await onIncomingAnswer(from, sdp);
          } catch (e) { console.error(e); }
        });
        socket.on("webrtc:ice-candidate", async ({ candidate, from }) => {
          try {
            await onIncomingIce(from, candidate);
          } catch (e) { console.warn(e); }
        });
        socket.on("presence:join", ({ userId, socketId }) => {
          if (userId) {
            connectedUserIds.add(userId);
            if (!participantsById.has(userId) && activeRoomId) {
              loadParticipantsForRoom(activeRoomId).catch((e) => console.warn(e));
            } else {
              refreshChatThreadPicker();
            }
          }
          if (socketId) {
            // peer WebRTC se maneja al negociar; aquí solo actualizamos estado de sala
          }
        });
        socket.on("presence:leave", ({ userId, socketId }) => {
          if (userId && userId !== currentUser?.usuarioId) {
            connectedUserIds.delete(userId);
            refreshChatThreadPicker();
          }
          if (socketId) cleanupPeer(socketId);
        });
        socket.on("recording:notify", ({ userId, active }) => {
          if (!userId) return;
          const sid = String(currentUser?.usuarioId || "").trim().toLowerCase();
          const oid = String(userId || "").trim().toLowerCase();
          if (sid && oid === sid) return;
          const u = [...participantsById.values()].find(
            (x) => String(x?.usuarioId || "").trim().toLowerCase() === oid
          );
          const name = u?.nombre || oid.slice(0, 8);
          appendRecordingNotice(
            active ? `${name} inició una grabación en esta sala.` : `${name} detuvo la grabación en esta sala.`
          );
        });
      });
    }

    async function enterRoom() {
      closeToolbarMenus();
      const roomId = $("roomIdInput").value.trim();
      if (!roomId) {
        log("Indica un Room ID");
        return;
      }
      setMediaStatus("Preparando cámara y micrófono…");
      log("Entrando en la sala…");
      let joinMediaLevel = "av";
      try {
        await loadIce();
        ({ level: joinMediaLevel } = await ensureLocalStream({ allowSilentJoin: true }));
        await connectSocketIfNeeded();
      } catch (e) {
        const msg = e?.name === "NotAllowedError" || e?.message?.includes("Permiso")
          ? humanizeGetUserMediaError(e)
          : e?.message || "Error al preparar la reunión";
        log(msg);
        setMediaStatus(msg);
        await stopLocalMedia({ micRecordingDownload: false });
        return;
      }

      try {
        await new Promise((resolve, reject) => {
          socket.emit("room:join", { roomId: normRoomKey(roomId) }, async (resp) => {
            if (!resp?.ok) {
              const errMsg =
                resp?.error === "No eres participante de esta reunión"
                  ? "No estás en la lista de la reunión. Pulsa «Unirse (API)» con el Room ID correcto."
                  : resp?.error || "No se pudo unir a la sala (Socket)";
              log(errMsg);
              setMediaStatus(errMsg);
              reject(new Error(errMsg));
              return;
            }
            activeRoomId = normRoomKey(
              resp.roomId != null && resp.roomId !== "" ? resp.roomId : roomId
            );
            activeReunionId = resp.reunionId != null ? String(resp.reunionId) : null;
            lastKnownRoomIdForRecording = activeRoomId;
            roomDocenteUsuarioId =
              resp.docenteUsuarioId != null
                ? String(resp.docenteUsuarioId)
                : roomDocenteUsuarioId;
            $("activeRoomLabel").textContent = activeRoomId;
            showRoom();
            setMeetView("gallery");
            _suppressHashRoute = true;
            location.hash = "#/meet/" + encodeURIComponent(activeRoomId) + "/gallery";
            _suppressHashRoute = false;
            ensureGeneralThread();
            chatThreads.forEach((t) => {
              t.unread = 0;
            });
            connectedUserIds.clear();
            if (currentUser?.usuarioId) connectedUserIds.add(currentUser.usuarioId);
            (resp.peers || []).forEach((p) => {
              if (p.userId) connectedUserIds.add(p.userId);
            });
            await loadParticipantsForRoom(activeRoomId);
            setActiveChatThread("general");
            let statusJoin =
              "En reunión. " +
              (resp.peers?.length ? resp.peers.length + " participante(s) ya en la sala." : "Eres el primero en la sala.");
            if (joinMediaLevel === "audio") {
              statusJoin += " Solo micrófono (sin cámara o cámara ocupada).";
            } else if (joinMediaLevel === "none") {
              statusJoin += " Sin mic ni cámara: tablero y chat disponibles.";
            }
            setMediaStatus(statusJoin);
            log("En sala. Peers: " + JSON.stringify(resp.peers));
            const peers = resp.peers || [];
            for (const p of peers) {
              try {
                await negotiateOffer(p.socketId);
              } catch (e) {
                console.error(e);
                log("Error al negociar con un peer: " + (e?.message || e));
              }
            }
            syncMediaButtons();
            updateMeetingVideoRecordButton();
            updateLocalAggregateStatus();
            refreshMediaDeviceSelectors().catch(() => {});
            const localWrap = $("localVideo")?.closest(".remote-peer");
            if (localWrap) {
              const dn = currentUser?.nombre?.trim();
              localWrap.setAttribute("data-label", dn ? dn + " (tú)" : "Tú");
            }
            setTimeout(() => {
              if (!followingPresenter) {
                resetBoardCamera();
              } else {
                syncZoomUi();
                drawBoard();
              }
            }, 0);
            resolve();
          });
        });
      } catch {
        await stopLocalMedia({ micRecordingDownload: false });
      }
    }

    async function leaveRoom() {
      closeToolbarMenus();
      const room = activeRoomId;
      if (socket && room) {
        try {
          socket.emit("room:leave", { roomId: room });
        } catch (_) {}
      }
      updateBoardFollowUi();
      for (const id of [...pcs.keys()]) cleanupPeer(id);
      await stopLocalMedia({ micRecordingDownload: true });

      activeRoomId = null;
      activeReunionId = null;
      pendingChatAdjunto = null;
      updateChatAdjuntoPendingUi();
      $("chatDropZone")?.classList.remove("chat-drop-zone--over");
      lastKnownRoomIdForRecording = null;
      roomDocenteUsuarioId = null;
      updateTeacherRecordingControlsVisibility();
      presenterFollowLeadActive = false;
      boardFollowRoomActive = false;
      followingPresenter = false;
      savedBoardCamera = null;
      pendingPresenterView = null;
      if (presenterViewEmitTimer) {
        clearTimeout(presenterViewEmitTimer);
        presenterViewEmitTimer = null;
      }
      closeInlineTextInput(false);
      drawing = false;
      currentStroke = null;
      boardState = { elementos: [] };
      resetBoardCamera();
      boardHistory.length = 0;
      boardFuture.length = 0;
      updateBoardHistoryButtons();
      $("remotesContainer").innerHTML = "";
      $("chatBox").innerHTML = "";
      chatThreads.clear();
      ensureGeneralThread();
      activeChatThreadKey = "general";
      connectedUserIds.clear();
      refreshChatThreadPicker();
      renderChatThreadTabs();
      $("roomSection").classList.add("hidden");
      document.body.classList.remove("body--in-room", "app-route-meet");
      const shell = $("roomShell");

      const vbtn = $("btnRoomViewToggle");

      setMediaStatus("");

      if (lc) lc.textContent = "";
      log("Saliste de la reunión. Cámara, micrófono y conexiones WebRTC liberados.");
    }

      if (!activeRoomId) {
        log("Entra en una sala antes de adjuntar archivos.");
        return;
      }
      if (!file) return;
      await uploadPendingChatFile(file);
    });

    (function bindChatDropZone() {
      const z = $("chatDropZone");
      if (!z) return;
      z.addEventListener("dragenter", (e) => {
        if (!activeRoomId) return;
        e.preventDefault();
      });
      z.addEventListener("dragover", (e) => {
        if (!activeRoomId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
        z.classList.add("chat-drop-zone--over");
      });
      z.addEventListener("dragleave", (e) => {
        if (!z.contains(e.relatedTarget)) z.classList.remove("chat-drop-zone--over");
      });
      z.addEventListener("drop", async (e) => {
        e.preventDefault();
        z.classList.remove("chat-drop-zone--over");
        if (!activeRoomId) {
          log("Entra en una sala antes de adjuntar archivos.");
          return;
        }
        const f = getFirstFileFromDataTransfer(e.dataTransfer);
        if (!f) {
          log(
            "Soltar: no se recibió ningún archivo (algunos orígenes no envían el fichero al navegador). Prueba Adjunto o arrastra desde el Explorador de archivos."
          );
          setMediaStatus("No se pudo leer el archivo al soltar.");
          return;
        }
        await uploadPendingChatFile(f);
      });
    })();

    $("btnEnviarChat").addEventListener("click", () => {
      const contenido = $("chatInput").value.trim();
      if ((!contenido && !pendingChatAdjunto) || !activeRoomId || !socket) return;
      const active = chatThreads.get(activeChatThreadKey) || chatThreads.get("general");
      const payload = {
        roomId: normRoomKey(activeRoomId),
        contenido,
        tipo: "general",
        ...(pendingChatAdjunto || {}),
      };
      if (active?.type === "dm" && active.targetUserId) {
        payload.tipo = "privado";
        payload.destinatarioUsuarioId = active.targetUserId;
      }
      socket.emit("chat:message", payload, (r) => {
        if (r && !r.ok) log("Chat: " + (r.error || "error"));
      });
      $("chatInput").value = "";
      pendingChatAdjunto = null;
      updateChatAdjuntoPendingUi();
      setMediaStatus("");
    });

    const canvas = $("board");
    populateBoardZoomSelect();
    resizeBoardCanvasToViewport({ preserveCenter: false, resetCamera: true });

    function isFiniteWorldPoint(p) {
      return p && Number.isFinite(p.x) && Number.isFinite(p.y);
    }

    function canvasPoint(e) {
      const c = $("board");
      if (!c || !e) return { x: NaN, y: NaN };
      const r = c.getBoundingClientRect();
      if (r.width <= 0 || r.height <= 0) return { x: NaN, y: NaN };
      const scaleX = c.width / r.width;
      const scaleY = c.height / r.height;
      const sx = (e.clientX - r.left) * scaleX;
      const sy = (e.clientY - r.top) * scaleY;
      if (!Number.isFinite(sx) || !Number.isFinite(sy)) return { x: NaN, y: NaN };
      return screenToWorld(sx, sy);
    }

    function handleHalfWorld() {
      return (HANDLE_SCREEN_PX / 2) / boardZoom;
    }

    function handleHitHalfWorld() {
      return (HANDLE_HIT_SCREEN_PX / 2) / boardZoom;
    }

    function getResizeHandleRects(bounds) {
      const hh = handleHalfWorld();
      const s = hh * 2;
      const x1 = bounds.x;
      const y1 = bounds.y;
      const x2 = bounds.x + bounds.w;
      const y2 = bounds.y + bounds.h;
      const mx = bounds.x + bounds.w / 2;
      const my = bounds.y + bounds.h / 2;
      const ids = [
        ["nw", x1, y1],
        ["n", mx, y1],
        ["ne", x2, y1],
        ["e", x2, my],
        ["se", x2, y2],
        ["s", mx, y2],
        ["sw", x1, y2],
        ["w", x1, my],
      ];
      return ids.map(([id, cx, cy]) => ({
        id,
        x: cx - hh,
        y: cy - hh,
        w: s,
        h: s,
      }));
    }

    function getResizeHandleHitRects(bounds) {
      const hh = handleHitHalfWorld();
      const s = hh * 2;
      const x1 = bounds.x;
      const y1 = bounds.y;
      const x2 = bounds.x + bounds.w;
      const y2 = bounds.y + bounds.h;
      const mx = bounds.x + bounds.w / 2;
      const my = bounds.y + bounds.h / 2;
      const ids = [
        ["nw", x1, y1],
        ["n", mx, y1],
        ["ne", x2, y1],
        ["e", x2, my],
        ["se", x2, y2],
        ["s", mx, y2],
        ["sw", x1, y2],
        ["w", x1, my],
      ];
      return ids.map(([id, cx, cy]) => ({
        id,
        x: cx - hh,
        y: cy - hh,
        w: s,
        h: s,
      }));
    }

    function hitTestResizeHandle(p, bounds) {
      if (!bounds) return null;
      const rects = getResizeHandleHitRects(bounds);
      for (let i = rects.length - 1; i >= 0; i--) {
        const r = rects[i];
        if (pointInRect(p, r)) return r.id;
      }
      return null;
    }

    function drawBoardWithPreview(previewStroke) {
      drawBoard();
      if (!previewStroke?.points?.length) return;
      const canvas = $("board");
      const c = canvas.getContext("2d");
      const z = boardZoom;
      c.save();
      c.setTransform(boardZoom, 0, 0, boardZoom, boardPanX, boardPanY);
      c.strokeStyle = previewStroke.color || "#111";
      c.lineWidth = (previewStroke.lineWidth || 2) / z;
      c.beginPath();
      c.moveTo(previewStroke.points[0].x, previewStroke.points[0].y);
      for (let i = 1; i < previewStroke.points.length; i++) {
        c.lineTo(previewStroke.points[i].x, previewStroke.points[i].y);
      }
      c.stroke();
      c.restore();
    }

    function getCurrentStrokeStyle() {
      if (boardTool === "eraser") {
        return {
          color: "#ffffff",
          lineWidth: Math.max(8, boardLineWidth + 2),
        };
      }
      return {
        color: boardColor,
        lineWidth: boardLineWidth,
      };
    }

    /** Tamaño de fuente del modelo «mundo» (misma unidad que `el.fontSize` en el tablero). No usar alto del textarea: con varias líneas inflaba el valor hasta 160. */
    function readTextFontSizeFromInput(inputEl) {
      const raw = inputEl.style?.fontSize || getComputedStyle(inputEl).fontSize;
      const n = parseFloat(String(raw).replace(/px\s*$/i, ""));
      if (Number.isFinite(n) && n > 0) return clampTextFontSize(n);
      return 18;
    }

    function clampTextFontSize(v) {
      return Math.max(8, Math.min(160, Math.round(v)));
    }

    /** Ancho de línea coherente con el canvas (incluye rebases negativos cuando el motor los expone). */
    function measureTextLineWidth(ctx, line) {
      const m = ctx.measureText(line);
      let w = m.width;
      if (m.actualBoundingBoxLeft !== undefined && m.actualBoundingBoxRight !== undefined) {
        const span = m.actualBoundingBoxRight - Math.min(0, m.actualBoundingBoxLeft);
        w = Math.max(w, span);
      }
      return w + 3;
    }

    function drawBoardTextElement(ctx, el, z) {
      ctx.fillStyle = el.color || "#111";
      const F = el.fontSize || 18;
      ctx.font = `${F / z}px sans-serif`;
      ctx.textBaseline = "top";
      const fsu = F / z;
      const lh = fsu * 1.2;
      const lines = String(el.text).split("\n");
      const x = el.x || 0;
      const y = el.y || 0;
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], x, y + i * lh);
      }
    }

    function getElementBounds(el, ctx) {
      if (!el) return null;
      if (el.type === "image" && el.src) {
        return { x: el.x || 0, y: el.y || 0, w: Math.max(1, el.w || 100), h: Math.max(1, el.h || 100) };
      }
      if (el.type === "text" && el.text != null && String(el.text).length > 0) {
        const z = boardZoom;
        const fsu = (el.fontSize || 18) / z;
        const lineHeight = fsu * 1.2;
        const lines = String(el.text).split("\n");
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.font = `${fsu}px sans-serif`;
        let maxW = 0;
        for (const line of lines) {
          maxW = Math.max(maxW, measureTextLineWidth(ctx, line || " "));
        }
        ctx.restore();
        const w = Math.max(16, Math.ceil(maxW + 4));
        const h = Math.max(10, Math.ceil(lines.length * lineHeight + 2));
        return { x: el.x || 0, y: el.y || 0, w, h };
      }
      return null;
    }

    function worldTextBoundsToCssRect(bounds, canvasEl) {
      const canvas = canvasEl;
      const rect = canvas.getBoundingClientRect();
      const z = boardZoom;
      const x1 = bounds.x * z + boardPanX;
      const y1 = bounds.y * z + boardPanY;
      const w1 = bounds.w * z;
      const h1 = bounds.h * z;
      const scaleX = rect.width / canvas.width;
      const scaleY = rect.height / canvas.height;
      return {
        left: rect.left + window.scrollX + x1 * scaleX,
        top: rect.top + window.scrollY + y1 * scaleY,
        width: Math.max(48, w1 * scaleX),
        height: Math.max(22, h1 * scaleY),
      };
    }

    function pointInRect(p, r) {
      return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
    }

    /** Zona de golpeo del icono — alineada con `drawLockedBadge` (esquina superior derecha del bbox). */
    function getLockedBadgeHitRect(el, ctx, zoom) {
      if (!el?.locked || (el.type !== "text" && el.type !== "image")) return null;
      const b = getElementBounds(el, ctx);
      if (!b) return null;
      const fs = 12 / zoom;
      const pad = 6 / zoom;
      const w = fs * 1.4 + pad;
      const h = fs * 1.35 + pad;
      const x = b.x + b.w - fs * 1.15 - pad * 0.5;
      const y = b.y + 2 / zoom - pad * 0.25;
      return { x, y, w, h };
    }

    function hitTestLockedBadge(p) {
      const context = $("board")?.getContext("2d");
      if (!context) return null;
      const z = boardZoom;
      for (let i = (boardState.elementos?.length || 0) - 1; i >= 0; i--) {
        const el = boardState.elementos[i];
        if (!(el?.type === "text" || el?.type === "image") || !el.locked) continue;
        const r = getLockedBadgeHitRect(el, context, z);
        if (r && pointInRect(p, r)) return { index: i, element: el };
      }
      return null;
    }

    function applyTextUniformScale(origEl, origBounds, startPoint, p) {
      const ox = origEl.x ?? origBounds.x;
      const oy = origEl.y ?? origBounds.y;
      const d0 = Math.hypot(startPoint.x - ox, startPoint.y - oy);
      const d1 = Math.hypot(p.x - ox, p.y - oy);
      if (d0 < 2) return { ...origEl };
      const scale = Math.max(0.2, Math.min(8, d1 / d0));
      const origFs = origEl.fontSize || 18;
      const newFs = clampTextFontSize(origFs * scale);
      return {
        ...origEl,
        fontSize: newFs,
        x: Math.round(ox),
        y: Math.round(oy),
      };
    }

    function applyImageResize(handleId, ox, oy, ow, oh, dx, dy, shiftKey) {
      let x = ox;
      let y = oy;
      let w = ow;
      let h = oh;
      const minSz = 24;
      if (shiftKey && (handleId === "nw" || handleId === "ne" || handleId === "sw" || handleId === "se")) {
        const scale = Math.max((ow + dx) / ow, (oh + dy) / oh);
        const u = Math.max(0.08, Math.min(8, scale));
        w = Math.max(minSz, Math.round(ow * u));
        h = Math.max(minSz, Math.round(oh * u));
        x = Math.round(ox + (ow - w) / 2);
        y = Math.round(oy + (oh - h) / 2);
        return { x, y, w, h };
      }
      switch (handleId) {
        case "se":
          w = ow + dx;
          h = oh + dy;
          break;
        case "e":
          w = ow + dx;
          break;
        case "s":
          h = oh + dy;
          break;
        case "w":
          x = ox + dx;
          w = ow - dx;
          break;
        case "n":
          y = oy + dy;
          h = oh - dy;
          break;
        case "ne":
          y = oy + dy;
          h = oh - dy;
          w = ow + dx;
          break;
        case "sw":
          x = ox + dx;
          w = ow - dx;
          h = oh + dy;
          break;
        case "nw":
          x = ox + dx;
          y = oy + dy;
          w = ow - dx;
          h = oh - dy;
          break;
        default:
          w = ow + dx;
          h = oh + dy;
      }
      w = Math.max(minSz, Math.round(w));
      h = Math.max(minSz, Math.round(h));
      x = Math.round(x);
      y = Math.round(y);
      return { x, y, w, h };
    }

    function hitTestEditableElement(p, includeLocked) {
      const context = $("board").getContext("2d");
      for (let i = (boardState.elementos?.length || 0) - 1; i >= 0; i--) {
        const el = boardState.elementos[i];
        if (!(el?.type === "text" || el?.type === "image")) continue;
        if (el.locked && !includeLocked) continue;
        const b = getElementBounds(el, context);
        if (!b) continue;
        if (pointInRect(p, b)) return { index: i, bounds: b, element: el };
      }
      return null;
    }

    function hitTestTextElement(p) {
      const context = $("board").getContext("2d");
      for (let i = (boardState.elementos?.length || 0) - 1; i >= 0; i--) {
        const el = boardState.elementos[i];
        if (el?.type !== "text") continue;
        if (el.locked) continue;
        const b = getElementBounds(el, context);
        if (!b) continue;
        if (pointInRect(p, b)) return { index: i, bounds: b, element: el };
      }
      return null;
    }

    function computeBoardContentBounds() {
      const ctx = $("board").getContext("2d");
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      const els = boardState.elementos || [];
      for (const el of els) {
        if (el.type === "stroke" && el.points?.length) {
          const hw = (el.lineWidth || 2) / 2;
          for (const pt of el.points) {
            minX = Math.min(minX, pt.x - hw);
            minY = Math.min(minY, pt.y - hw);
            maxX = Math.max(maxX, pt.x + hw);
            maxY = Math.max(maxY, pt.y + hw);
          }
        } else if (el.type === "text" || el.type === "image") {
          const b = getElementBounds(el, ctx);
          if (b) {
            minX = Math.min(minX, b.x);
            minY = Math.min(minY, b.y);
            maxX = Math.max(maxX, b.x + b.w);
            maxY = Math.max(maxY, b.y + b.h);
          }
        }
      }
      if (!Number.isFinite(minX)) return null;
      const pad = 24;
      return {
        minX: minX - pad,
        minY: minY - pad,
        width: maxX - minX + 2 * pad,
        height: maxY - minY + 2 * pad,
      };
    }

    function renderBoardElementsForExport(ctx, z) {
      const els = boardState.elementos || [];
      for (const el of els) {
        if (el.type === "stroke" && el.points?.length) {
          ctx.strokeStyle = el.color || "#111";
          ctx.lineWidth = (el.lineWidth || 2) / z;
          ctx.beginPath();
          ctx.moveTo(el.points[0].x, el.points[0].y);
          for (let i = 1; i < el.points.length; i++) {
            ctx.lineTo(el.points[i].x, el.points[i].y);
          }
          ctx.stroke();
        } else if (el.type === "text" && el.text) {
          drawBoardTextElement(ctx, el, z);
        } else if (el.type === "image" && el.src) {
          const cached = boardImageCache.get(el.src);
          if (cached?.ready) {
            ctx.drawImage(cached.image, el.x || 0, el.y || 0, el.w || 100, el.h || 100);
          }
        }
      }
    }

    function drawSelectionOverlay(ctx) {
      if (selectedElementIndex < 0) return;
      const el = boardState.elementos?.[selectedElementIndex];
      if (!el || (el.type !== "text" && el.type !== "image")) return;
      const b = getElementBounds(el, ctx);
      if (!b) return;
      ctx.save();
      const lockedSel = !!el.locked;
      ctx.strokeStyle = lockedSel ? "#c2410c" : "#2563eb";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 4]);
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.setLineDash([]);
      if (!lockedSel) {
        ctx.fillStyle = "#2563eb";
        for (const h of getResizeHandleRects(b)) {
          ctx.fillRect(h.x, h.y, h.w, h.h);
        }
      }
      ctx.restore();
    }

    function commitPointerMutation(snapshotBefore) {
      if (!snapshotBefore) return;
      boardHistory.push(snapshotBefore);
      if (boardHistory.length > BOARD_HISTORY_LIMIT) boardHistory.shift();
      boardFuture.length = 0;
      drawBoard();
      updateBoardHistoryButtons();
      emitBoardUpdate();
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(reader.error || new Error("No se pudo leer la imagen del portapapeles."));
        reader.readAsDataURL(file);
      });
    }

    function loadImageFromSrc(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("No se pudo cargar la imagen pegada."));
        img.src = src;
      });
    }

    function openInlineTextInput(p, opts = {}) {
      const editIndex = opts.editIndex != null ? opts.editIndex : null;
      const selectionBeforeEdit = selectedElementIndex;
      const canvas = $("board");
      closeInlineTextInput(false);
      editingTextElementIndex = editIndex != null ? editIndex : -1;
      selectedElementIndex = -1;
      drawBoard();

      const worldX = editIndex != null && boardState.elementos[editIndex] ? boardState.elementos[editIndex].x : p.x;
      const worldY = editIndex != null && boardState.elementos[editIndex] ? boardState.elementos[editIndex].y : p.y;

      const input = document.createElement("textarea");
      input.className = "board-text-inline";
      input.placeholder = "Enter = nueva línea · Ctrl+Enter = guardar";
      input.rows = 1;
      if (editIndex != null && boardState.elementos[editIndex]) {
        const el = boardState.elementos[editIndex];
        input.value = el.text || "";
        boardColor = el.color || boardColor;
        input.style.color = el.color || boardColor || "#111111";
        const fs = el.fontSize || 18;
        input.style.fontSize = `${fs}px`;
      } else {
        input.style.color = boardColor;
        input.style.fontSize = "18px";
      }
      const createdAt = Date.now();
      let committedOrCancelled = false;

      const syncEditorLayout = () => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = rect.width / canvas.width;
        const scaleY = rect.height / canvas.height;
        const z = boardZoom;
        const fs = readTextFontSizeFromInput(input);
        const fsu = fs / z;
        const lineHeightCanvas = fsu * 1.2;
        const lines = input.value.length > 0 ? input.value.split("\n") : [" "];
        const ctx2 = canvas.getContext("2d");
        ctx2.save();
        ctx2.setTransform(1, 0, 0, 1, 0, 0);
        ctx2.font = `${fsu}px sans-serif`;
        let maxW = 0;
        for (const line of lines) {
          maxW = Math.max(maxW, measureTextLineWidth(ctx2, line || " "));
        }
        ctx2.restore();
        const padX = 10;
        const padY = 6;
        const textW = Math.ceil(maxW * scaleX) + padX * 2;
        const textH = Math.ceil(lines.length * lineHeightCanvas * scaleY) + padY * 2;
        const x1 = worldX * z + boardPanX;
        const y1 = worldY * z + boardPanY;
        input.style.left = `${rect.left + window.scrollX + x1 * scaleX}px`;
        input.style.top = `${rect.top + window.scrollY + y1 * scaleY}px`;
        input.style.width = `${Math.max(64, textW)}px`;
        input.style.height = `${Math.max(28, textH)}px`;
        input.style.fontSize = `${fs}px`;
        input.style.lineHeight = "1.2";
        input.style.fontFamily = "sans-serif";
      };

      const commit = () => {
        if (committedOrCancelled) return;
        committedOrCancelled = true;
        const textRaw = input.value;
        const isEmpty = !String(textRaw).trim();
        if (!activeRoomId) {
          closeInlineTextInput(false);
          return;
        }
        const fontCommit = readTextFontSizeFromInput(input);
        const colorCommit = boardColor;
        if (editIndex != null && boardState.elementos[editIndex]) {
          const next = cloneBoardState(boardState);
          if (isEmpty) {
            next.elementos.splice(editIndex, 1);
            selectedElementIndex = -1;
          } else {
            next.elementos[editIndex] = {
              ...next.elementos[editIndex],
              type: "text",
              text: textRaw,
              color: colorCommit,
              fontSize: fontCommit,
            };
          }
          applyBoardState(next, { recordHistory: true, clearFuture: true, emit: true });
          if (!isEmpty) {
            selectedElementIndex = editIndex;
            drawBoard();
          }
        } else if (!isEmpty) {
          const next = cloneBoardState(boardState);
          next.elementos.push({
            type: "text",
            text: textRaw,
            x: p.x,
            y: p.y,
            color: colorCommit,
            fontSize: fontCommit,
          });
          applyBoardState(next, { recordHistory: true, clearFuture: true, emit: true });
          selectedElementIndex = boardState.elementos.length - 1;
          drawBoard();
        }
        closeInlineTextInput(false);
      };
      const cancel = () => {
        if (committedOrCancelled) return;
        committedOrCancelled = true;
        selectedElementIndex = selectionBeforeEdit;
        closeInlineTextInput(false);
        drawBoard();
      };

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.ctrlKey) {
          e.preventDefault();
          commit();
        } else if (e.key === "Escape") {
          e.preventDefault();
          cancel();
        }
      });
      input.addEventListener("input", () => {
        syncEditorLayout();
      });
      input.addEventListener("blur", () => {
        if (Date.now() - createdAt < 120) return;
        commit();
      });

      document.body.appendChild(input);
      activeTextInput = input;
      syncEditorLayout();
      input.focus({ preventScroll: true });
      if (editIndex != null) {
        const len = input.value.length;
        input.setSelectionRange(len, len);
      } else {
        input.setSelectionRange(0, 0);
      }
    }

    function closeInlineTextInput(keepFocusCanvas = true) {
      editingTextElementIndex = -1;
      if (!activeTextInput) return;
      const node = activeTextInput;
      activeTextInput = null;
      if (node.parentElement) node.parentElement.removeChild(node);
      if (keepFocusCanvas) $("board")?.focus({ preventScroll: true });
    }

    async function exportBoardToPdf() {
      try {
        const { jsPDF } = window.jspdf || {};
        if (!jsPDF) {
          log("No se pudo cargar el motor de PDF. Revisa tu conexión a internet.");
          return;
        }
        const bounds = computeBoardContentBounds();
        if (!bounds || bounds.width <= 0 || bounds.height <= 0) {
          log("No hay contenido para exportar.");
          return;
        }
        let bw = bounds.width;
        let bh = bounds.height;
        const MAX_EDGE = 8192;
        let scaleCap = 1;
        if (bw > MAX_EDGE || bh > MAX_EDGE) {
          scaleCap = MAX_EDGE / Math.max(bw, bh);
          bw = Math.max(1, Math.floor(bw * scaleCap));
          bh = Math.max(1, Math.floor(bh * scaleCap));
        }
        const exportCanvas = document.createElement("canvas");
        exportCanvas.width = bw;
        exportCanvas.height = bh;
        const ctx = exportCanvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, bw, bh);
        ctx.save();
        ctx.scale(scaleCap, scaleCap);
        ctx.translate(-bounds.minX, -bounds.minY);
        renderBoardElementsForExport(ctx, 1);
        ctx.restore();

        const imageData = exportCanvas.toDataURL("image/png");

        const orientation = exportCanvas.width >= exportCanvas.height ? "landscape" : "portrait";
        const pdf = new jsPDF({ orientation, unit: "mm", format: "a4", compress: true });

        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const margin = 10;
        const drawW = pageW - margin * 2;
        const drawH = pageH - margin * 2 - 12;

        const scale = Math.min(drawW / exportCanvas.width, drawH / exportCanvas.height);
        const imgW = exportCanvas.width * scale;
        const imgH = exportCanvas.height * scale;
        const x = (pageW - imgW) / 2;
        const y = margin + 10;

        pdf.setFontSize(11);
        const roomLabel = activeRoomId ? `Sala: ${activeRoomId}` : "Tablero";
        pdf.text(roomLabel, margin, margin + 4);
        pdf.addImage(imageData, "PNG", x, y, imgW, imgH, undefined, "FAST");

        const stamp = new Date().toISOString().replace(/[:.]/g, "-");
        const filename = `tablero-${activeRoomId || "sin-sala"}-${stamp}.pdf`;
        pdf.save(filename);
        log("PDF exportado (recorte al contenido).");
      } catch (e) {
        console.error(e);
        log("Error exportando PDF: " + (e?.message || e));
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (!activeRoomId) return;
      if (e.button === 2 || (boardTool === "hand" && e.button === 0)) {
        e.preventDefault();
        if (isBoardViewLocked()) return;
        handDrag = { cx: e.clientX, cy: e.clientY, panX: boardPanX, panY: boardPanY };
        canvas.setPointerCapture(e.pointerId);
        refreshBoardCursor();
        return;
      }
      if (boardTool === "pointer") {
        closeInlineTextInput(false);
        const p = canvasPoint(e);
        if (!isFiniteWorldPoint(p)) return;
        const badgeHit = hitTestLockedBadge(p);
        if (badgeHit) {
          e.preventDefault();
          selectedElementIndex = badgeHit.index;
          pointerAction = null;
          drawBoard();
          canvas.focus();
          return;
        }
        if (e.altKey) e.preventDefault();
        const hit = hitTestEditableElement(p, e.altKey);
        if (!hit) {
          selectedElementIndex = -1;
          pointerAction = null;
          drawBoard();
          return;
        }
        if (hit.element.locked) {
          selectedElementIndex = hit.index;
          pointerAction = null;
          drawBoard();
          canvas.focus();
          return;
        }
        selectedElementIndex = hit.index;
        const hId = hitTestResizeHandle(p, hit.bounds);
        const mode = hId ? "resize" : "drag";
        pointerAction = {
          mode,
          resizeHandle: hId || null,
          index: hit.index,
          startPoint: p,
          originalElement: { ...hit.element },
          originalBounds: { ...hit.bounds },
          snapshotBefore: cloneBoardState(boardState),
        };
        drawBoard();
        canvas.setPointerCapture(e.pointerId);
        canvas.focus();
        return;
      }
      if (boardTool === "text") {
        return;
      }
      canvas.setPointerCapture(e.pointerId);
      drawing = true;
      const p = canvasPoint(e);
      if (!isFiniteWorldPoint(p)) {
        drawing = false;
        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch (_) {}
        return;
      }
      const style = getCurrentStrokeStyle();
      currentStroke = { type: "stroke", points: [p], color: style.color, lineWidth: style.lineWidth };
    });
    canvas.addEventListener("pointermove", (e) => {
      if (handDrag) {
        const r = canvas.getBoundingClientRect();
        const scaleX = canvas.width / r.width;
        const scaleY = canvas.height / r.height;
        const dcx = (e.clientX - handDrag.cx) * scaleX;
        const dcy = (e.clientY - handDrag.cy) * scaleY;
        boardPanX = handDrag.panX + dcx;
        boardPanY = handDrag.panY + dcy;
        drawBoard();
        scheduleEmitPresenterView();
        return;
      }
      if (boardTool === "pointer" && pointerAction) {
        const p = canvasPoint(e);
        if (!isFiniteWorldPoint(p)) return;
        const dx = p.x - pointerAction.startPoint.x;
        const dy = p.y - pointerAction.startPoint.y;
        const idx = pointerAction.index;
        const current = boardState.elementos?.[idx];
        if (!current) return;
        let nextEl = { ...pointerAction.originalElement };
        if (pointerAction.mode === "drag") {
          nextEl.x = Math.round((pointerAction.originalElement.x || 0) + dx);
          nextEl.y = Math.round((pointerAction.originalElement.y || 0) + dy);
        } else if (pointerAction.mode === "resize") {
          const hid = pointerAction.resizeHandle || "se";
          if (nextEl.type === "image") {
            const o = pointerAction.originalElement;
            const ox = o.x || 0;
            const oy = o.y || 0;
            const ow = Math.max(1, o.w || 100);
            const oh = Math.max(1, o.h || 100);
            const r = applyImageResize(hid, ox, oy, ow, oh, dx, dy, e.shiftKey);
            nextEl.x = r.x;
            nextEl.y = r.y;
            nextEl.w = r.w;
            nextEl.h = r.h;
          } else if (nextEl.type === "text") {
            const ob = pointerAction.originalBounds;
            nextEl = applyTextUniformScale(pointerAction.originalElement, ob, pointerAction.startPoint, p);
          }
        }
        boardState.elementos[idx] = nextEl;
        drawBoard();
        return;
      }
      if (!drawing || !currentStroke) return;
      const pm = canvasPoint(e);
      if (!isFiniteWorldPoint(pm)) return;
      currentStroke.points.push(pm);
      drawBoardWithPreview(currentStroke);
    });
    function endStroke(e) {
      if (handDrag) {
        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch (_) {}
        handDrag = null;
        refreshBoardCursor();
        drawBoard();
        return;
      }
      if (pointerAction) {
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        const moved =
          JSON.stringify(boardState.elementos?.[pointerAction.index] || null) !==
          JSON.stringify(pointerAction.originalElement || null);
        const snapshotBefore = pointerAction.snapshotBefore;
        pointerAction = null;
        if (moved) commitPointerMutation(snapshotBefore);
        else drawBoard();
        return;
      }
      if (!drawing) return;
      drawing = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      if (!currentStroke || !activeRoomId) return;
      const pts = currentStroke.points.filter((q) => isFiniteWorldPoint(q));
      if (pts.length === 0) {
        currentStroke = null;
        drawBoard();
        return;
      }
      if (pts.length === 1) pts.push({ x: pts[0].x, y: pts[0].y });
      const next = cloneBoardState(boardState);
      next.elementos.push({ ...currentStroke, points: pts });
      currentStroke = null;
      applyBoardState(next, { recordHistory: true, clearFuture: true, emit: true });
    }
    canvas.addEventListener("pointerup", endStroke);
    canvas.addEventListener("pointercancel", endStroke);
    canvas.addEventListener("click", (e) => {
      if (!activeRoomId) return;
      if (boardTool !== "text") return;
      const p = canvasPoint(e);
      openInlineTextInput(p);
    });

    canvas.addEventListener("dblclick", (e) => {
      if (!activeRoomId || activeTextInput) return;
      if (boardTool !== "pointer") return;
      e.preventDefault();
      const p = canvasPoint(e);
      const hit = hitTestTextElement(p);
      if (!hit) return;
      openInlineTextInput({ x: hit.element.x, y: hit.element.y }, { editIndex: hit.index });
    });

    window.addEventListener("paste", async (e) => {
      if (!activeRoomId) return;
      if (activeTextInput && document.activeElement === activeTextInput) return;

      const clipFile = getClipboardFile(e.clipboardData);
      const routeToChat = isChatPasteOrDropTarget(e.target) || chatInputHasFocus();

      if (routeToChat && clipFile) {
        e.preventDefault();
        await uploadPendingChatFile(clipFile);
        return;
      }
      if (routeToChat) {
        return;
      }

      const items = e.clipboardData?.items;
      if (!items?.length) return;
      const imageItem = [...items].find((it) => String(it.type || "").startsWith("image/"));
      if (!imageItem) return;
      const file = imageItem.getAsFile?.();
      if (!file) return;

      e.preventDefault();
      try {
        const dataUrl = await fileToDataUrl(file);
        const img = await loadImageFromSrc(dataUrl);
        const visW = canvas.width / boardZoom;
        const visH = canvas.height / boardZoom;
        const maxW = Math.round(visW * 0.55);
        const maxH = Math.round(visH * 0.55);
        const scale = Math.min(maxW / img.width, maxH / img.height, 1);
        const w = Math.max(32, Math.round(img.width * scale));
        const h = Math.max(32, Math.round(img.height * scale));
        const cx = (canvas.width / 2 - boardPanX) / boardZoom;
        const cy = (canvas.height / 2 - boardPanY) / boardZoom;
        const x = Math.round(cx - w / 2);
        const y = Math.round(cy - h / 2);

        boardImageCache.set(dataUrl, { loading: false, ready: true, image: img });
        const next = cloneBoardState(boardState);
        next.elementos.push({ type: "image", src: dataUrl, x, y, w, h });
        applyBoardState(next, { recordHistory: true, clearFuture: true, emit: true });
        log("Imagen pegada en el tablero.");
      } catch (err) {
        console.error(err);
        log("No se pudo pegar la imagen: " + (err?.message || err));
      }
    });

    function isBoardShortcutBlockedTarget(target) {
      if (!target) return false;
      const id = target.id || "";
      if (id === "chatInput" || id === "email" || id === "password" || id === "nombre" || id === "roomIdInput") return true;
      if (target.closest?.("#authSection")) return true;
      return false;
    }

    window.addEventListener("keydown", (e) => {
      if (!activeRoomId || activeTextInput) return;
      if (isBoardShortcutBlockedTarget(e.target)) return;

      if (e.ctrlKey && (e.key === "c" || e.key === "C")) {
        if (boardTool === "pointer" && selectedElementIndex >= 0) {
          const el = boardState.elementos[selectedElementIndex];
          if (el?.locked) return;
          if (el && (el.type === "text" || el.type === "image")) {
            e.preventDefault();
            clipboardBoardElement = JSON.parse(JSON.stringify(el));
            log("Copiado al portapapeles del tablero (Ctrl+V).");
            return;
          }
        }
      }
      if (e.ctrlKey && (e.key === "v" || e.key === "V") && clipboardBoardElement) {
        e.preventDefault();
        const copy = JSON.parse(JSON.stringify(clipboardBoardElement));
        delete copy.locked;
        copy.x = Math.round((copy.x || 0) + 24);
        copy.y = Math.round((copy.y || 0) + 24);
        const next = cloneBoardState(boardState);
        next.elementos.push(copy);
        selectedElementIndex = next.elementos.length - 1;
        applyBoardState(next, { recordHistory: true, clearFuture: true, emit: true });
        log("Pegado en el tablero.");
        return;
      }

      if (e.ctrlKey && !e.shiftKey && (e.key === "z" || e.key === "Z")) {
        e.preventDefault();
        performBoardUndo();
        return;
      }
      if (
        e.ctrlKey &&
        (e.key === "y" ||
          e.key === "Y" ||
          (e.shiftKey && (e.key === "z" || e.key === "Z")))
      ) {
        e.preventDefault();
        performBoardRedo();
        return;
      }

      if (
        (e.key === "Delete" || e.key === "Backspace") &&
        boardTool === "pointer" &&
        selectedElementIndex >= 0
      ) {
        const delEl = boardState.elementos?.[selectedElementIndex];
        if (delEl?.locked) return;
        if (delEl && (delEl.type === "text" || delEl.type === "image")) {
          e.preventDefault();
          const next = cloneBoardState(boardState);
          next.elementos.splice(selectedElementIndex, 1);
          selectedElementIndex = -1;
          applyBoardState(next, { recordHistory: true, clearFuture: true, emit: true });
          return;
        }
      }

      if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) {
        const k = e.key.toLowerCase();
        const tools = { v: "pointer", h: "hand", p: "pencil", e: "eraser", t: "text" };
        if (tools[k]) {
          e.preventDefault();
          boardTool = tools[k];
          updateBoardToolUi();
          return;
        }
      }

      if (selectedElementIndex < 0) return;
      const target = e.target;
      if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.isContentEditable)) return;
      if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
      const el = boardState.elementos?.[selectedElementIndex];
      if (!el || (el.type !== "text" && el.type !== "image")) return;
      if (el.locked) return;
      e.preventDefault();
      const step = e.shiftKey ? 10 : 2;
      const before = cloneBoardState(boardState);
      const moved = { ...el };
      if (e.key === "ArrowUp") moved.y = Math.round((moved.y || 0) - step);
      if (e.key === "ArrowDown") moved.y = Math.round((moved.y || 0) + step);
      if (e.key === "ArrowLeft") moved.x = Math.round((moved.x || 0) - step);
      if (e.key === "ArrowRight") moved.x = Math.round((moved.x || 0) + step);
      boardState.elementos[selectedElementIndex] = moved;
      commitPointerMutation(before);
    });
    $("btnToolPointer")?.addEventListener("click", () => {
      boardTool = "pointer";
      updateBoardToolUi();
    });
    $("btnToolHand")?.addEventListener("click", () => {
      boardTool = "hand";
      updateBoardToolUi();
    });
    $("btnToolPencil")?.addEventListener("click", () => {
      boardTool = "pencil";
      updateBoardToolUi();
    });
    $("btnToolEraser")?.addEventListener("click", () => {
      boardTool = "eraser";
      updateBoardToolUi();
    });
    $("btnToolText")?.addEventListener("click", () => {
      boardTool = "text";
      updateBoardToolUi();
    });
    document.querySelectorAll(".color-swatch").forEach((el) => {
      el.addEventListener("click", () => {
        const c = el.dataset.color;
        if (!c) return;
        boardColor = c;
        if (boardTool === "eraser") boardTool = "pencil";
        updateBoardToolUi();
      });
    });
    $("boardColor")?.addEventListener("input", (e) => {
      boardColor = e.target.value || "#111111";
      if (boardTool === "eraser") boardTool = "pencil";
      updateBoardToolUi();
    });
    $("boardLineWidth")?.addEventListener("change", (e) => {
      boardLineWidth = Number(e.target.value) || 4;
    });
    $("btnBoardUndo")?.addEventListener("click", performBoardUndo);
    $("btnBoardRedo")?.addEventListener("click", performBoardRedo);
    $("btnBoardToggleLock")?.addEventListener("click", () => toggleSelectedElementLock());
    $("btnBoardToggleLockFloat")?.addEventListener("mousedown", (e) => {
      e.stopPropagation();
    });
    $("btnBoardToggleLockFloat")?.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      toggleSelectedElementLock();
    });
    const boardViewportEl = $("boardViewportWrap");
    if (boardViewportEl && typeof ResizeObserver !== "undefined") {
      new ResizeObserver(() => {
        resizeBoardCanvasToViewport({ preserveCenter: true, resetCamera: false });
        updateSelectionLockFloatPosition();
      }).observe(boardViewportEl);
    }
    window.addEventListener("resize", () => {
      resizeBoardCanvasToViewport({ preserveCenter: true, resetCamera: false });
      updateSelectionLockFloatPosition();
    });
    $("btnBoardClear")?.addEventListener("click", () => {
      if (!activeRoomId) return;
      if (!confirm("¿Limpiar tablero para todos?")) return;
      applyBoardState({ elementos: [] }, { recordHistory: true, clearFuture: true, emit: true });
    });
    $("btnExportPdf").addEventListener("click", exportBoardToPdf);
    $("btnBoardFollowLead")?.addEventListener("click", () => {
      if (!activeRoomId) {
        log("Seguir vista: no hay sala activa.");
        return;
      }
      if (!socket?.connected) {
        log("Seguir vista: sin conexión Socket.IO.");
        setMediaStatus("Sin conexión con el servidor. Recarga la página.");
        return;
      }
      if (!isRoomDocente()) {
        log(
          "Seguir vista: solo el docente de esta reunión puede usar este botón (comprueba que iniciaste sesión como el creador de la sala)."
        );
        return;
      }
      const next = !presenterFollowLeadActive;
      const rid = normRoomKey(activeRoomId);
      socket.emit(
        "board:follow:set",
        { roomId: rid, enabled: next },
        (r) => {
          if (!r?.ok) {
            log(r?.error || "No se pudo cambiar el modo «seguir vista».");
            setMediaStatus(r?.error || "No se pudo cambiar «seguir vista».");
            return;
          }
          log(next ? "Modo «audiencia sigue mi vista» activado." : "Vista de la audiencia liberada.");
        }
      );
    });

    canvas.addEventListener("contextmenu", (e) => {
      if (activeRoomId) e.preventDefault();
    });
    canvas.addEventListener(
      "wheel",
      (e) => {
        if (!activeRoomId || !e.ctrlKey || isBoardViewLocked()) return;
        e.preventDefault();
        const r = canvas.getBoundingClientRect();
        const scaleX = canvas.width / r.width;
        const scaleY = canvas.height / r.height;
        const sx = (e.clientX - r.left) * scaleX;
        const sy = (e.clientY - r.top) * scaleY;
        const factor = e.deltaY > 0 ? 0.9 : 1.1;
        setBoardZoomAnchored(boardZoom * factor, sx, sy);
      },
      { passive: false }
    );

    $("boardMinimap")?.addEventListener("click", (e) => {
      if (!activeRoomId || isBoardViewLocked()) return;
      const mini = $("boardMinimap");
      const c = $("board");
      if (!mini || !c) return;
      const r = mini.getBoundingClientRect();
      const mx = (e.clientX - r.left) * (mini.width / r.width);
      const my = (e.clientY - r.top) * (mini.height / r.height);
      if (!minimapWorldRect || !Number.isFinite(minimapWorldRect.scale) || minimapWorldRect.scale <= 0) return;
      const wx = (mx - minimapWorldRect.offsetX) / minimapWorldRect.scale + minimapWorldRect.minX;
      const wy = (my - minimapWorldRect.offsetY) / minimapWorldRect.scale + minimapWorldRect.minY;
      boardPanX = c.width / 2 - wx * boardZoom;
      boardPanY = c.height / 2 - wy * boardZoom;
      drawBoard();
      scheduleEmitPresenterView();
    });

    $("btnZoomIn")?.addEventListener("click", () => {
      const c = $("board");
      if (!c) return;
      const cur = Math.round(boardZoom * 100);
      const nextPct = Math.min(300, Math.ceil(cur / 10) * 10 + 10);
      setBoardZoomAnchored(nextPct / 100, c.width / 2, c.height / 2);
    });
    $("btnZoomOut")?.addEventListener("click", () => {
      const c = $("board");
      if (!c) return;
      const cur = Math.round(boardZoom * 100);
      const nextPct = Math.max(10, Math.floor(cur / 10) * 10 - 10);
      setBoardZoomAnchored(nextPct / 100, c.width / 2, c.height / 2);
    });
    $("btnZoomReset")?.addEventListener("click", () => {
      if (isBoardViewLocked()) return;
      resetBoardCamera();
    });
    $("boardZoomSelect")?.addEventListener("change", (e) => {
      const sel = e.target;
      if (sel._zoomSyncing) return;
      const pct = Number(sel.value);
      if (!Number.isFinite(pct)) return;
      const c = $("board");
      if (!c) return;
      setBoardZoomAnchored(pct / 100, c.width / 2, c.height / 2);
    });
    $("btnMinimapToggle")?.addEventListener("click", () => {
      $("boardMinimap")?.classList.toggle("hidden-map");
      drawBoard();
    });

    window.addEventListener("beforeunload", (e) => {
      if (isMeetingVideoRecordingActive()) {
        e.preventDefault();
        e.returnValue = "";
      }
    });

    window.addEventListener("pagehide", () => {
      const room = activeRoomId;
      if (socket?.connected && room) {
        try {
          socket.emit("room:leave", { roomId: room });
        } catch (_) {}
      }
      void stopLocalMedia({ micRecordingDownload: true }).catch(() => {});
    });

    (function initRoomShellLayout() {
      try {
        const w = localStorage.getItem("moj_room_chat_width_px");
        if (w && !Number.isNaN(Number(w))) {
          const n = Math.min(520, Math.max(200, Number(w)));
          document.documentElement.style.setProperty("--room-chat-width", n + "px");
        }
      } catch (_) {}
      const spl = $("roomMainChatSplitter");
      if (spl) {
        spl.addEventListener("mousedown", (e) => {
          const startX = e.clientX;
          const startW =
            parseInt(
              getComputedStyle(document.documentElement).getPropertyValue("--room-chat-width") || "320",
              10
            ) || 320;
          e.preventDefault();
          const onMove = (e2) => {
            const dx = startX - e2.clientX;
            const nw = Math.min(520, Math.max(200, startW + dx));
            document.documentElement.style.setProperty("--room-chat-width", nw + "px");
          };
          const onUp = () => {
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
            try {
              const v = getComputedStyle(document.documentElement).getPropertyValue("--room-chat-width");
              const n = parseInt(v, 10);
              if (Number.isFinite(n)) localStorage.setItem("moj_room_chat_width_px", String(n));
            } catch (_) {}
            try {
              syncZoomUi();
              if (typeof drawBoard === "function") drawBoard();
            } catch (_) {}
          };
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });
      }
    })();

    window.addEventListener("hashchange", async () => {
      if (_suppressHashRoute) return;
      const r = parseRoute();
      if (r.name !== "meet" && activeRoomId) {
        await leaveRoom();
      }
      applyRouteFromHash();
    });

    (async function init() {
      await loadIce();
      updateBoardToolUi();
      updateBoardHistoryButtons();
      ensureGeneralThread();
      renderChatThreadTabs();
      refreshChatThreadPicker();
      if (getToken()) {
        try {
          const me = await api("/api/usuarios/me");
          currentUser = me.usuario;
          $("userLabel").textContent = me.usuario.nombre + " (" + me.usuario.rol + ")";
          log("Sesión restaurada");
        } catch {
          currentUser = null;
          setToken(null);
        }
      }
      if (!location.hash || location.hash === "#" || location.hash === "#/") {
        _suppressHashRoute = true;
        location.hash = getToken() ? "#/lobby" : "#/login";
        _suppressHashRoute = false;
      }
      applyRouteFromHash();
    })();
  </script>
</body>
</html>
