    let _suppressHashRoute = false;

    function parseRoute() {
      let h = (location.hash || "").replace(/^#/, "");
      if (!h || h === "/") return { name: getToken() ? "lobby" : "login" };
      if (!h.startsWith("/")) h = "/" + h;
      const segs = h.split("/").filter(Boolean);
      if (segs[0] === "login") return { name: "login" };
      if (segs[0] === "lobby") return { name: "lobby" };
      if (segs[0] === "meet" && segs[1]) {
        const view = segs[2] === "gallery" ? "gallery" : "board";
        return { name: "meet", roomId: segs[1], view };
      }
      return { name: getToken() ? "lobby" : "login" };
    }

    function setMeetView(view) {
      const shell = $("roomShell");
      if (!shell) return;
      const gallery = view === "gallery";
      shell.classList.toggle("room-shell--gallery", gallery);
      const vbtn = $("btnRoomViewToggle");
      if (vbtn) {
        vbtn.textContent = gallery ? "Vista tablero" : "Vista galería";
        vbtn.setAttribute("aria-pressed", gallery ? "true" : "false");
      }
    }

    function applyRouteFromHash() {
      if (_suppressHashRoute) return;
      const r = parseRoute();
      document.body.classList.remove("app-route-login", "app-route-lobby", "app-route-meet");

      if (r.name === "login") {
        showAuth();
        document.body.classList.add("app-route-login");
        return;
      }
      if (r.name === "lobby") {
        if (!getToken()) {
          _suppressHashRoute = true;
          location.hash = "#/login";
          _suppressHashRoute = false;
          applyRouteFromHash();
          return;
        }
        showLobby();
        document.body.classList.add("app-route-lobby");
        return;
      }
      if (r.name === "meet") {
        document.body.classList.add("app-route-meet");
        if (!getToken()) {
          _suppressHashRoute = true;
          location.hash = "#/login";
          _suppressHashRoute = false;
          applyRouteFromHash();
          return;
        }
        const ridNorm = normRoomKey(r.roomId);
        if (activeRoomId && normRoomKey(activeRoomId) === ridNorm) {
          showRoom();
          setMeetView(r.view);
          setTimeout(() => {
            try {
              syncZoomUi();
              drawBoard();
            } catch (e) {}
          }, 0);
          return;
        }
        $("roomIdInput").value = r.roomId;
        showLobby();
        document.body.classList.remove("app-route-meet");
        document.body.classList.add("app-route-lobby");
        log("Room ID cargado desde el enlace. Pulsa «Entrar a la sala» para unirte.");
        _suppressHashRoute = true;
        location.hash = "#/lobby";
        _suppressHashRoute = false;
        applyRouteFromHash();
      }
    }

    /** Bitrate de audio explícito (Opus/WebM); evita defaults muy bajos que suenan “comprimidos”. */
    const RECORDER_AUDIO_BITS_PER_SECOND = 128000;
    const RECORDER_VIDEO_BITS_PER_SECOND = 2_500_000;

    function getPreferredMeetingVideoMimeType() {
      const candidates = [
        "video/webm;codecs=vp9,opus",
        "video/webm;codecs=vp8,opus",
        "video/webm",
      ];
      if (typeof MediaRecorder === "undefined" || !MediaRecorder.isTypeSupported) return "";
      for (const c of candidates) {
        if (MediaRecorder.isTypeSupported(c)) return c;
      }
      return "";
    }

    /**
     * Crea MediaRecorder de vídeo+audio probando opciones.
     * @param {MediaStream} recordStream
     * @param {string} mime
     */
    function createMeetingVideoMediaRecorder(recordStream, mime) {
      const attempts = [];
      if (mime) {
        attempts.push({
          mimeType: mime,
          videoBitsPerSecond: RECORDER_VIDEO_BITS_PER_SECOND,
          audioBitsPerSecond: RECORDER_AUDIO_BITS_PER_SECOND,
        });
        attempts.push({ mimeType: mime });
      }
      attempts.push({ videoBitsPerSecond: RECORDER_VIDEO_BITS_PER_SECOND, audioBitsPerSecond: RECORDER_AUDIO_BITS_PER_SECOND });
      attempts.push({});
      let lastErr = null;
      for (const opts of attempts) {
        try {
          if (Object.keys(opts).length === 0) {
            return new MediaRecorder(recordStream);
          }
          return new MediaRecorder(recordStream, opts);
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error("MediaRecorder");
    }

    /**
     * `AudioContext`, destino de mezcla, compresor y ramas local/remoto según modo actual.
     * Debe llamarse tras `teardownRecordingAudioMix()` y con medios listos.
     * @returns {Promise<boolean>}
     */
    async function setupRecordingMixInfrastructure() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) {
          log("Este navegador no expone AudioContext.");
          setMediaStatus("Mezcla de audio no disponible.");
          return false;
        }
        mixAudioCtx = new AC();
        await mixAudioCtx.resume();
      } catch (e) {
        log("No se pudo iniciar AudioContext: " + (e?.message || e));
        setMediaStatus("Grabación de audio no disponible (AudioContext).");
        teardownRecordingAudioMix();
        return false;
      }
      mixDestination = mixAudioCtx.createMediaStreamDestination();
      try {
        mixMasterCompressor = mixAudioCtx.createDynamicsCompressor();
        mixMasterCompressor.threshold.setValueAtTime(-22, mixAudioCtx.currentTime);
        mixMasterCompressor.knee.setValueAtTime(30, mixAudioCtx.currentTime);
        mixMasterCompressor.ratio.setValueAtTime(2.5, mixAudioCtx.currentTime);
        mixMasterCompressor.attack.setValueAtTime(0.01, mixAudioCtx.currentTime);
        mixMasterCompressor.release.setValueAtTime(0.2, mixAudioCtx.currentTime);
        mixMasterCompressor.connect(mixDestination);
      } catch (e) {
        console.warn("mixMasterCompressor", e);
        mixMasterCompressor = null;
      }
      if (shouldConnectLocalToRecordingMix()) {
        connectLocalToMix();
      }
      if (shouldConnectRemoteToRecordingMix()) {
        for (const sid of pcs.keys()) {
          connectRemotePeerToMix(sid);
        }
      }
      return true;
    }

    function isMeetingVideoRecordingActive() {
      return !!(meetingVideoMediaRecorder && meetingVideoMediaRecorder.state === "recording");
    }

    /** Grafo de mezcla activo mientras se graba vídeo (el audio va en el mismo archivo). */
    function isMeetingRecordingMixActive() {
      return isMeetingVideoRecordingActive();
    }

    /** full | local | remote — solo para el grafo de grabación (diagnóstico). */
    function getRecordMixMode() {
      const sel = $("recordMixModeSelect");
      const v = sel?.value;
      if (v === "local" || v === "remote") return v;
      return "full";
    }

    /** @returns {"top" | "right"} */
    function getRecordVideoLayout() {
      const sel = $("recordVideoLayoutSelect");
      return sel?.value === "right" ? "right" : "top";
    }

    function shouldConnectLocalToRecordingMix() {
      const m = getRecordMixMode();
      return m === "full" || m === "local";
    }

    function shouldConnectRemoteToRecordingMix() {
      const m = getRecordMixMode();
      return m === "full" || m === "remote";
    }

    function setRecordMixModeSelectDisabled(disabled) {
      const sel = $("recordMixModeSelect");
      if (sel) sel.disabled = !!disabled;
    }

    function setRecordingMixControlsDisabled(disabled) {
      setRecordMixModeSelectDisabled(disabled);
      const lo = $("recordVideoLayoutSelect");
      if (lo) lo.disabled = !!disabled;
    }

    function updateMeetingVideoRecordButton() {
      const btn = $("btnRecordMeetingVideo");
      if (!btn) return;
      const rec = isMeetingVideoRecordingActive();
      const lbl = btn.querySelector(".room-tb-label");
      if (lbl) lbl.textContent = rec ? "Parar" : "Grabar";
      btn.setAttribute("aria-label", rec ? "Parar grabación de vídeo" : "Grabar vídeo de la reunión");
      btn.setAttribute("aria-pressed", rec ? "true" : "false");
      btn.title = rec ? "Detener la grabación y descargar" : "Graba vídeo compuesto de la reunión";
      btn.classList.toggle("room-tb-btn--record-active", rec);
    }

    function disconnectRemotePeerFromMix(remoteSocketId) {
      const entry = mixRemoteSources.get(remoteSocketId);
      if (!entry) return;
      try {
        entry.source.disconnect();
      } catch (_) {}
      try {
        entry.gain.disconnect();
      } catch (_) {}
      mixRemoteSources.delete(remoteSocketId);
    }

    /** Destino de la cadena de grabación: compresor maestro o el destino WebAudio. */
    function mixRecordingOutputNode() {
      return mixMasterCompressor || mixDestination;
    }

    function teardownRecordingAudioMix() {
      if (mixLocalSource) {
        try {
          mixLocalSource.disconnect();
        } catch (_) {}
        mixLocalSource = null;
      }
      if (mixLocalGainNode) {
        try {
          mixLocalGainNode.disconnect();
        } catch (_) {}
        mixLocalGainNode = null;
      }
      for (const id of [...mixRemoteSources.keys()]) {
        disconnectRemotePeerFromMix(id);
      }
      mixRemoteSources.clear();
      if (mixMasterCompressor) {
        try {
          mixMasterCompressor.disconnect();
        } catch (_) {}
        mixMasterCompressor = null;
      }
      if (mixAudioCtx && mixAudioCtx.state !== "closed") {
        mixAudioCtx.close().catch(() => {});
      }
      mixAudioCtx = null;
      mixDestination = null;
    }

    function connectLocalToMix() {
      const out = mixRecordingOutputNode();
      if (!out || !mixAudioCtx) return;
      if (mixLocalSource) {
        try {
          mixLocalSource.disconnect();
        } catch (_) {}
        mixLocalSource = null;
      }
      if (mixLocalGainNode) {
        try {
          mixLocalGainNode.disconnect();
        } catch (_) {}
        mixLocalGainNode = null;
      }
      const tracks = (localStream?.getAudioTracks() || []).filter((t) => t.readyState === "live");
      if (!tracks.length) return;
      try {
        const src = mixAudioCtx.createMediaStreamSource(new MediaStream(tracks));
        const gain = mixAudioCtx.createGain();
        gain.gain.value = RECORDING_MIX_BRANCH_GAIN;
        src.connect(gain);
        gain.connect(out);
        mixLocalSource = src;
        mixLocalGainNode = gain;
      } catch (e) {
        console.warn("connectLocalToMix", e);
      }
    }

    function connectRemotePeerToMix(remoteSocketId) {
      const out = mixRecordingOutputNode();
      if (!out || !mixAudioCtx) return;
      disconnectRemotePeerFromMix(remoteSocketId);
      const pc = pcs.get(remoteSocketId);
      if (!pc) return;
      const audioTracks = pc
        .getReceivers()
        .map((r) => r.track)
        .filter((t) => t && t.kind === "audio" && t.readyState === "live");
      if (!audioTracks.length) return;
      try {
        const stream = new MediaStream(audioTracks);
        const src = mixAudioCtx.createMediaStreamSource(stream);
        const gain = mixAudioCtx.createGain();
        gain.gain.value = RECORDING_MIX_BRANCH_GAIN;
        src.connect(gain);
        gain.connect(out);
        mixRemoteSources.set(remoteSocketId, { source: src, gain });
      } catch (e) {
        console.warn("connectRemotePeerToMix", e);
      }
    }

    function teardownMeetingVideoComposite() {
      if (compositeVideoRafId) {
        cancelAnimationFrame(compositeVideoRafId);
        compositeVideoRafId = 0;
      }
      compositeVideoCanvas = null;
      compositeVideoCtx = null;
    }

    /** @returns {HTMLVideoElement[]} */
    function collectCompositeVideoElements() {
      const out = [];
      const lv = $("localVideo");
      if (lv?.srcObject?.getVideoTracks) {
        const vt = lv.srcObject.getVideoTracks()[0];
        if (vt && vt.readyState === "live" && vt.enabled) out.push(lv);
      }
      for (const vid of remoteVideos.values()) {
        if (vid?.srcObject?.getVideoTracks) {
          const vt = vid.srcObject.getVideoTracks()[0];
          if (vt && vt.readyState === "live" && vt.enabled) out.push(vid);
        }
      }
      return out;
    }

    function strokeCompositeDebugVideoZone(ctx, x, y, w, h) {
      if (!DEBUG_COMPOSITE) return;
      const ix = Math.round(x);
      const iy = Math.round(y);
      const iw = Math.max(1, Math.round(w));
      const ih = Math.max(1, Math.round(h));
      ctx.save();
      ctx.strokeStyle = "rgba(255, 0, 0, 0.9)";
      ctx.lineWidth = 2;
      ctx.strokeRect(ix, iy, iw, ih);
      ctx.restore();
    }

    function strokeCompositeDebugBoardZone(ctx, x, y, w, h) {
      if (!DEBUG_COMPOSITE) return;
      const ix = Math.round(x);
      const iy = Math.round(y);
      const iw = Math.max(1, Math.round(w));
      const ih = Math.max(1, Math.round(h));
      ctx.save();
      ctx.strokeStyle = "rgba(0, 100, 255, 0.95)";
      ctx.lineWidth = 2;
      ctx.strokeRect(ix, iy, iw, ih);
      ctx.restore();
    }

    /** Reparte `total` px en `n` segmentos enteros que suman exactamente `total`. */
    function partitionSegmentLengths(total, n) {
      const nn = Math.max(1, n);
      const t = Math.max(0, Math.floor(total));
      const base = Math.floor(t / nn);
      const rem = t - base * nn;
      const out = [];
      for (let i = 0; i < nn; i++) {
        out.push(base + (i < rem ? 1 : 0));
      }
      return out;
    }

    /** object-fit: contain — encuadre completo dentro de la celda (barras negras si el ratio choca; evita recorte tipo cover en celdas muy alargadas). */
    function drawVideoContainInCell(ctx, video, vx, vy, vw, vh) {
      const ix = Math.round(vx);
      const iy = Math.round(vy);
      const iw = Math.max(1, Math.round(vw));
      const ih = Math.max(1, Math.round(vh));
      if (!video.videoWidth || !video.videoHeight) return;
      const w = video.videoWidth;
      const h = video.videoHeight;
      const vr = w / h;
      const tr = iw / ih;
      let dw;
      let dh;
      let dx;
      let dy;
      if (vr > tr) {
        dw = iw;
        dh = iw / vr;
        dx = ix;
        dy = iy + (ih - dh) / 2;
      } else {
        dh = ih;
        dw = ih * vr;
        dx = ix + (iw - dw) / 2;
        dy = iy;
      }
      ctx.fillStyle = "#000";
      ctx.fillRect(ix, iy, iw, ih);
      try {
        ctx.drawImage(video, dx, dy, dw, dh);
      } catch (_) {}
    }

    function drawVideosStripPlaceholder(ctx, x, y, rw, rh) {
      ctx.fillStyle = "#1a1a1a";
      ctx.fillRect(x, y, rw, rh);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "600 22px system-ui,sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Sin vídeo activo", x + rw / 2, y + rh / 2);
    }

    /** Una sola fila: miniaturas contiguas (anchos enteros que suman rw); siempre contain en grabación. */
    function drawVideosHorizontalStrip(ctx, videos, x, y, rw, rh) {
      const n = videos.length;
      const rx = Math.round(x);
      const ry = Math.round(y);
      const rwInt = Math.max(1, Math.round(rw));
      const rhInt = Math.max(1, Math.round(rh));
      if (n === 0) {
        drawVideosStripPlaceholder(ctx, rx, ry, rwInt, rhInt);
        strokeCompositeDebugVideoZone(ctx, rx, ry, rwInt, rhInt);
        return;
      }
      const widths = partitionSegmentLengths(rwInt, n);
      let cx = rx;
      for (let i = 0; i < n; i++) {
        drawVideoContainInCell(ctx, videos[i], cx, ry, widths[i], rhInt);
        strokeCompositeDebugVideoZone(ctx, cx, ry, widths[i], rhInt);
        cx += widths[i];
      }
    }

    /** Una sola columna: miniaturas apiladas (altos enteros que suman rh); contain como la fila superior. */
    function drawVideosVerticalStrip(ctx, videos, x, y, rw, rh) {
      const n = videos.length;
      const rx = Math.round(x);
      const ry = Math.round(y);
      const rwInt = Math.max(1, Math.round(rw));
      const rhInt = Math.max(1, Math.round(rh));
      if (n === 0) {
        drawVideosStripPlaceholder(ctx, rx, ry, rwInt, rhInt);
        strokeCompositeDebugVideoZone(ctx, rx, ry, rwInt, rhInt);
        return;
      }
      const heights = partitionSegmentLengths(rhInt, n);
      let cy = ry;
      for (let i = 0; i < n; i++) {
        drawVideoContainInCell(ctx, videos[i], rx, cy, rwInt, heights[i]);
        strokeCompositeDebugVideoZone(ctx, rx, cy, rwInt, heights[i]);
        cy += heights[i];
      }
    }

    function drawBoardLetterbox(ctx, boardEl, bx, by, bw, bh) {
      if (!boardEl?.width) return;
      const br = boardEl.width / boardEl.height;
      const tr = bw / bh;
      let dw;
      let dh;
      let dx;
      let dy;
      if (br > tr) {
        dw = bw;
        dh = bw / br;
        dx = bx;
        dy = by + (bh - dh) / 2;
      } else {
        dh = bh;
        dw = bh * br;
        dx = bx + (bw - dw) / 2;
        dy = by;
      }
      ctx.fillStyle = "#e5e7eb";
      ctx.fillRect(bx, by, bw, bh);
      try {
        ctx.drawImage(boardEl, dx, dy, dw, dh);
      } catch (_) {}
    }

    function drawSharedScreenLetterbox(ctx, videoEl, bx, by, bw, bh) {
      if (!videoEl?.videoWidth || !videoEl?.videoHeight) return;
      drawVideoContainInCell(ctx, videoEl, bx, by, bw, bh);
    }

    function compositeMeetingVideoFrame() {
      if (!meetingVideoMediaRecorder || meetingVideoMediaRecorder.state !== "recording") {
        compositeVideoRafId = 0;
        return;
      }
      const ctx = compositeVideoCtx;
      const canvas = compositeVideoCanvas;
      if (!ctx || !canvas) {
        compositeVideoRafId = 0;
        return;
      }
      const W = canvas.width;
      const H = canvas.height;
      const boardEl = $("board");
      const layout = getRecordVideoLayout();
      const vids = collectCompositeVideoElements();
      const shareVideo = getScreenShareCompositeVideoEl();

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#0f0f0f";
      ctx.fillRect(0, 0, W, H);

      if (shareVideo) {
        if (layout === "top") {
          let vh = Math.floor(H * 0.135);
          vh = Math.max(MEETING_STRIP_TOP_H_MIN, Math.min(MEETING_STRIP_TOP_H_MAX, vh));
          drawVideosHorizontalStrip(ctx, vids, 0, 0, W, vh);
          drawSharedScreenLetterbox(ctx, shareVideo, 0, vh, W, H - vh);
          strokeCompositeDebugBoardZone(ctx, 0, vh, W, H - vh);
        } else {
          let vw = Math.floor(W * 0.152);
          vw = Math.max(MEETING_STRIP_RIGHT_W_MIN, Math.min(MEETING_STRIP_RIGHT_W_MAX, vw));
          const sw = W - vw;
          drawSharedScreenLetterbox(ctx, shareVideo, 0, 0, sw, H);
          strokeCompositeDebugBoardZone(ctx, 0, 0, sw, H);
          drawVideosVerticalStrip(ctx, vids, sw, 0, vw, H);
        }
        compositeVideoRafId = requestAnimationFrame(compositeMeetingVideoFrame);
        return;
      }

      if (!boardEl) {
        drawVideosHorizontalStrip(ctx, vids, 0, 0, W, H);
        compositeVideoRafId = requestAnimationFrame(compositeMeetingVideoFrame);
        return;
      }

      if (layout === "top") {
        let vh = Math.floor(H * 0.135);
        vh = Math.max(MEETING_STRIP_TOP_H_MIN, Math.min(MEETING_STRIP_TOP_H_MAX, vh));
        drawVideosHorizontalStrip(ctx, vids, 0, 0, W, vh);
        drawBoardLetterbox(ctx, boardEl, 0, vh, W, H - vh);
        strokeCompositeDebugBoardZone(ctx, 0, vh, W, H - vh);
      } else {
        let vw = Math.floor(W * 0.152);
        vw = Math.max(MEETING_STRIP_RIGHT_W_MIN, Math.min(MEETING_STRIP_RIGHT_W_MAX, vw));
        const bw = W - vw;
        drawBoardLetterbox(ctx, boardEl, 0, 0, bw, H);
        strokeCompositeDebugBoardZone(ctx, 0, 0, bw, H);
        drawVideosVerticalStrip(ctx, vids, bw, 0, vw, H);
      }
      compositeVideoRafId = requestAnimationFrame(compositeMeetingVideoFrame);
    }

    /**
     * Detiene grabación vídeo compuesto.
     * @param {{ download?: boolean }} options
     */
    async function stopMeetingVideoRecording(options = { download: true }) {
      const rec = meetingVideoMediaRecorder;
      const shouldNotifyStop = !!(rec && rec.state === "recording");
      if (!rec || rec.state === "inactive") {
        meetingVideoMediaRecorder = null;
        meetingVideoRecordedChunks = [];
        meetingVideoRecorderChosenMime = "";
        teardownMeetingVideoComposite();
        teardownRecordingAudioMix();
        setRecordingMixControlsDisabled(false);
        updateMeetingVideoRecordButton();
        return;
      }
      await new Promise((resolve) => {
        const done = () => resolve();
        rec.addEventListener("stop", done, { once: true });
        try {
          rec.stop();
        } catch (e) {
          console.warn("stopMeetingVideoRecording", e);
          resolve();
        }
      });
      const mime = meetingVideoRecorderChosenMime || rec.mimeType || "video/webm";
      const chunks = meetingVideoRecordedChunks.slice();
      meetingVideoMediaRecorder = null;
      meetingVideoRecordedChunks = [];
      meetingVideoRecorderChosenMime = "";
      teardownMeetingVideoComposite();
      updateMeetingVideoRecordButton();
      const blob = new Blob(chunks, { type: mime });
      const roomKey = String(activeRoomId || lastKnownRoomIdForRecording || "sin-sala").slice(0, 36);
      if (blob.size > 0) {
        try {
          await idbSaveRecording(blob, mime, roomKey);
        } catch (e) {
          console.warn("idbSaveRecording", e);
          log("No se pudo guardar copia en IndexedDB: " + (e?.message || e));
        }
        if (options.download !== false) {
          const okDl = triggerDownloadBlob(blob, mime, roomKey);
          if (okDl) {
            log("Grabación de vídeo descargada; copia local en IndexedDB.");
            setMediaStatus("Grabación de vídeo terminada: archivo descargado.");
          } else {
            log("Descarga bloqueada o cancelada; revisa «Grabaciones guardadas».");
            setMediaStatus("Vídeo guardado en el navegador (IndexedDB).");
          }
        } else {
          log("Grabación de vídeo detenida (copia en IndexedDB si hubo datos).");
          setMediaStatus("");
        }
      } else {
        log("Grabación de vídeo sin datos (0 bytes).");
        setMediaStatus("No se grabó vídeo (0 bytes).");
      }
      teardownRecordingAudioMix();
      if (shouldNotifyStop) {
        emitRecordingState(false);
      }
      setRecordingMixControlsDisabled(false);
    }

    async function startMeetingVideoRecording() {
      if (typeof MediaRecorder === "undefined") {
        log("Este navegador no soporta MediaRecorder.");
        return;
      }
      if (!isRoomDocente()) {
        log("Solo el docente de la reunión puede iniciar la grabación.");
        setMediaStatus("La grabación solo está disponible para el docente de esta sala.");
        return;
      }
      if (!activeRoomId) {
        log("Entra en una sala antes de grabar.");
        return;
      }
      if (isMeetingVideoRecordingActive()) {
        log("Ya hay una grabación de vídeo en curso.");
        return;
      }
      const mimeV = getPreferredMeetingVideoMimeType();
      if (!mimeV) {
        log("Este navegador no soporta vídeo WebM para grabación.");
        setMediaStatus("Grabación de vídeo no soportada en este navegador.");
        return;
      }
      try {
        await ensureLocalStream({ allowSilentJoin: false });
      } catch {
        return;
      }
      teardownRecordingAudioMix();
      teardownMeetingVideoComposite();
      if (!(await setupRecordingMixInfrastructure())) {
        return;
      }

      compositeVideoCanvas = document.createElement("canvas");
      compositeVideoCanvas.width = MEETING_VIDEO_W;
      compositeVideoCanvas.height = MEETING_VIDEO_H;
      compositeVideoCtx = compositeVideoCanvas.getContext("2d");

      const videoTracks = compositeVideoCanvas.captureStream(MEETING_VIDEO_FPS).getVideoTracks();
      const audioTracks = mixDestination.stream.getAudioTracks();
      const combined = new MediaStream([...videoTracks, ...audioTracks]);

      meetingVideoRecordedChunks = [];
      try {
        meetingVideoMediaRecorder = createMeetingVideoMediaRecorder(combined, mimeV);
      } catch (e2) {
        log("No se pudo iniciar MediaRecorder de vídeo: " + (e2?.message || e2));
        setMediaStatus("No se pudo iniciar la grabación de vídeo.");
        teardownMeetingVideoComposite();
        teardownRecordingAudioMix();
        return;
      }
      meetingVideoRecorderChosenMime = meetingVideoMediaRecorder.mimeType || mimeV || "video/webm";
      meetingVideoMediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) meetingVideoRecordedChunks.push(e.data);
      };
      meetingVideoMediaRecorder.onerror = (ev) => {
        console.warn("MediaRecorder vídeo", ev);
        log("Error en la grabación de vídeo: " + (ev.error?.message || "desconocido"));
      };
      try {
        meetingVideoMediaRecorder.start();
      } catch (e) {
        meetingVideoMediaRecorder = null;
        meetingVideoRecordedChunks = [];
        teardownMeetingVideoComposite();
        teardownRecordingAudioMix();
        log("Grabación vídeo: " + (e?.message || e));
        return;
      }
      lastKnownRoomIdForRecording = activeRoomId;
      emitRecordingState(true);
      updateMeetingVideoRecordButton();
      setRecordingMixControlsDisabled(true);
      compositeMeetingVideoFrame();
      setMediaStatus(
        "Grabando vídeo (cámaras + audio mezclado). «Parar grabación de vídeo» para terminar."
      );
      log("Grabación de vídeo iniciada · " + MEETING_VIDEO_W + "×" + MEETING_VIDEO_H + " @ ~" + MEETING_VIDEO_FPS + " fps.");
    }

    async function toggleMeetingVideoRecording() {
      if (!isRoomDocente()) {
        log("Solo el docente de la reunión puede usar la grabación.");
        return;
      }
      if (isMeetingVideoRecordingActive()) {
        await stopMeetingVideoRecording({ download: true });
      } else {
        await startMeetingVideoRecording();
      }
    }

    /**
     * Libera cámara/micrófono. Opcionalmente descarga la grabación de vídeo si sigue activa.
     * @param {{ micRecordingDownload?: boolean }} opts
     */
    async function stopLocalMedia(opts = {}) {
      const downloadMic = opts.micRecordingDownload === true;
      await stopScreenShare();
      await stopMeetingVideoRecording({ download: downloadMic });
      if (localStream) {
        localStream.getTracks().forEach((t) => {
          try {
            t.stop();
          } catch (_) {}
        });
        localStream = null;
      }
      const lv = $("localVideo");
      if (lv) lv.srcObject = null;
      syncMediaButtons();
      updateMeetingVideoRecordButton();
    }

    function syncMediaButtons() {
      const btnMic = $("btnToggleMic");
      const btnCam = $("btnToggleCam");
      if (!btnMic || !btnCam) return;
      const a = localStream?.getAudioTracks()[0];
      const v = localStream?.getVideoTracks()[0];
      const micOn = !!(a && a.readyState === "live" && a.enabled);
      const camOn = !!(v && v.readyState === "live" && v.enabled);
      btnMic.disabled = !a;
      btnMic.dataset.off = micOn ? "false" : "true";
      btnMic.setAttribute("aria-label", micOn ? "Micrófono encendido" : "Micrófono silenciado");
      btnMic.title = micOn ? "Silenciar micrófono" : "Activar micrófono";
      const micOnIco = btnMic.querySelector(".room-tb-ico-mic-on");
      const micOffIco = btnMic.querySelector(".room-tb-ico-mic-off");
      if (micOnIco && micOffIco) {
        micOnIco.classList.toggle("hidden", !micOn);
        micOffIco.classList.toggle("hidden", micOn);
      }
      if (!v) {
        btnCam.dataset.off = "true";
        btnCam.disabled = true;
        btnCam.setAttribute("aria-label", localStream ? "Cámara no disponible" : "Cámara apagada");
        const cOn = btnCam.querySelector(".room-tb-ico-cam-on");
        const cOff = btnCam.querySelector(".room-tb-ico-cam-off");
        if (cOn && cOff) {
          cOn.classList.add("hidden");
          cOff.classList.remove("hidden");
        }
      } else {
        btnCam.disabled = false;
        btnCam.dataset.off = camOn ? "false" : "true";
        btnCam.setAttribute("aria-label", camOn ? "Cámara encendida" : "Cámara apagada");
        btnCam.title = camOn ? "Apagar cámara" : "Encender cámara";
        const cOn = btnCam.querySelector(".room-tb-ico-cam-on");
        const cOff = btnCam.querySelector(".room-tb-ico-cam-off");
        if (cOn && cOff) {
          cOn.classList.toggle("hidden", !camOn);
          cOff.classList.toggle("hidden", camOn);
        }
      }
    }

    function setMicEnabled(on) {
      if (!localStream) return;
      localStream.getAudioTracks().forEach((t) => {
        t.enabled = on;
      });
      syncMediaButtons();
    }

    function setCamEnabled(on) {
      if (!localStream) return;
      localStream.getVideoTracks().forEach((t) => {
        t.enabled = on;
      });
      syncMediaButtons();
    }

    async function syncLocalTracksToAllSenders() {
      if (!localStream || pcs.size === 0) return;
      const audio = localStream.getAudioTracks()[0] ?? null;
      const video = getOutgoingVideoTrack();
      for (const [, pc] of pcs) {
        for (const sender of pc.getSenders()) {
          if (typeof sender.replaceTrack !== "function") continue;
          const cur = sender.track;
          try {
            if (cur?.kind === "audio") {
              await sender.replaceTrack(audio);
            } else if (cur?.kind === "video") {
              await sender.replaceTrack(video);
            }
          } catch (e) {
            console.warn("replaceTrack", e);
          }
        }
        let hasLiveVideo = false;
        for (const sender of pc.getSenders()) {
          if (sender.track?.kind === "video") hasLiveVideo = true;
        }
        if (video && !hasLiveVideo) {
          for (const sender of pc.getSenders()) {
            if (!sender.track && typeof sender.replaceTrack === "function") {
              try {
                await sender.replaceTrack(video);
                hasLiveVideo = true;
                break;
              } catch (e) {
                console.warn("replaceTrack resume video", e);
              }
            }
          }
          if (!hasLiveVideo) {
            try {
              pc.addTrack(video, localStream);
            } catch (e) {
              console.warn("addTrack video", e);
            }
          }
        }
        if (!video) {
          for (const sender of pc.getSenders()) {
            if (sender.track?.kind === "video" && typeof sender.replaceTrack === "function") {
              try {
                await sender.replaceTrack(null);
              } catch (e) {
                console.warn("replaceTrack video null", e);
              }
            }
          }
        }
      }
      if (isMeetingRecordingMixActive() && shouldConnectLocalToRecordingMix()) {
        connectLocalToMix();
      }
    }

    function peerConnectionIsDead(pc) {
      if (!pc) return true;
      const cs = pc.connectionState;
      const ics = pc.iceConnectionState;
      return cs === "failed" || cs === "closed" || ics === "failed" || ics === "closed";
    }

    function updatePeerStatus(remoteSocketId) {
      const pc = pcs.get(remoteSocketId);
      const el = peerStatusEls.get(remoteSocketId);
      if (!el) return;
      if (!pc) {
        el.textContent = "Sin enlace activo · Pulsa «Reintentar enlace»";
        return;
      }
      const cs = pc.connectionState || "?";
      const ics = pc.iceConnectionState || "?";
      el.textContent = "Conexión: " + cs + " · ICE: " + ics;
    }

    function updateLocalAggregateStatus() {
      const el = $("localConnStatus");
      if (!el) return;
      if (!activeRoomId) {
        el.textContent = "";
        return;
      }
      if (pcs.size === 0) {
        el.textContent = "Enlaces WebRTC: ninguno (esperando participantes)";
        return;
      }
      const parts = [];
      for (const [id, pc] of pcs) {
        const short = id.length > 8 ? id.slice(0, 6) + "…" : id;
        parts.push(short + " " + pc.connectionState + "/" + pc.iceConnectionState);
      }
      el.textContent = "Tus enlaces (" + pcs.size + "): " + parts.join(" · ");
    }

    /**
     * Garantiza `localStream` con medios o vacío.
     * @param {{ allowSilentJoin?: boolean }} opts `allowSilentJoin` por defecto true: si falla mic+cámara y mic, entra sin pistas. false: lanza error si no hay al menos mic.
     * @returns {Promise<{ level: "av" | "audio" | "none"; mediaError: string }>}
     */
    async function ensureLocalStream(opts = {}) {
      const allowSilentJoin = opts.allowSilentJoin !== false;
      let acquiredNew = false;
      if (localStream) {
        const a = localStream.getAudioTracks()[0];
        const v = localStream.getVideoTracks()[0];
        if (a?.readyState === "live" || v?.readyState === "live") {
          $("localVideo").srcObject = localStream;
          syncMediaButtons();
          const level =
            v?.readyState === "live" && a?.readyState === "live"
              ? "av"
              : v?.readyState === "live"
                ? "av"
                : "audio";
          return { level, mediaError: "" };
        }
        await stopLocalMedia({ micRecordingDownload: false });
      }
      const { stream, level, mediaError } = await acquireLocalMediaWithFallbacks({ allowSilentJoin });
      localStream = stream;
      acquiredNew = true;
      $("localVideo").srcObject = localStream;
      if (level === "av") {
        setMediaStatus("");
      } else if (level === "audio") {
        setMediaStatus(
          (mediaError ? mediaError + " " : "") + "Solo micrófono activo (sin cámara o cámara ocupada)."
        );
      } else {
        setMediaStatus(
          (mediaError ? mediaError + " " : "") +
            "Sin micrófono ni cámara: puedes usar tablero y chat. Pulsa «Reiniciar cámara y mic» cuando haya dispositivos libres."
        );
      }
      syncMediaButtons();
      refreshMediaDeviceSelectors().catch(() => {});
      if (acquiredNew && pcs.size > 0) {
        try {
          await syncLocalTracksToAllSenders();
        } catch (e) {
          console.warn(e);
        }
      }
      updateLocalAggregateStatus();
      return { level, mediaError };
    }

    async function reiniciarMediosEnReunion() {
      if (!activeRoomId) return;
      await stopMeetingVideoRecording({ download: false });
      setMediaStatus("Reiniciando cámara y micrófono…");
      try {
        await stopLocalMedia({ micRecordingDownload: false });
        const { level, mediaError } = await ensureLocalStream({ allowSilentJoin: true });
        let msg = "Medios reiniciados; tracks actualizados en los enlaces activos.";
        if (level === "audio") {
          msg = (mediaError ? mediaError + " " : "") + "Solo micrófono. " + msg;
        } else if (level === "none") {
          msg = (mediaError ? mediaError + " " : "") + "Sin mic ni cámara. " + msg;
        }
        setMediaStatus(msg);
      } catch (e) {
        const msg = humanizeGetUserMediaError(e);
        setMediaStatus(msg);
        log("Reiniciar medios: " + msg);
      }
    }

    function teardownPeerPcOnly(remoteSocketId) {
      disconnectRemotePeerFromMix(remoteSocketId);
      const pc = pcs.get(remoteSocketId);
      if (pc) {
        if (pc._peerStatusHandler) {
          pc.removeEventListener("connectionstatechange", pc._peerStatusHandler);
          pc.removeEventListener("iceconnectionstatechange", pc._peerStatusHandler);
          delete pc._peerStatusHandler;
        }
        try {
          pc.close();
        } catch (_) {}
        pcs.delete(remoteSocketId);
      }
      const vid = remoteVideos.get(remoteSocketId);
      if (vid) vid.srcObject = null;
      updatePeerStatus(remoteSocketId);
      updateLocalAggregateStatus();
    }

    function ensureRemotePeerUi(remoteSocketId) {
      if (remoteVideos.has(remoteSocketId)) return;
      const vid = document.createElement("video");
      vid.autoplay = true;
      vid.playsInline = true;
      vid.dataset.peer = remoteSocketId;
      const wrap = document.createElement("div");
      wrap.className = "remote-peer";
      wrap.setAttribute("data-label", "Participante remoto");
      const cap = document.createElement("div");
      cap.className = "peer-cap";
      cap.textContent = "Participante remoto";
      const statusEl = document.createElement("div");
      statusEl.className = "peer-conn-status";
      statusEl.textContent = "Conexión: nueva · ICE: nueva";
      const retryBtn = document.createElement("button");
      retryBtn.type = "button";
      retryBtn.className = "peer-retry-btn";
      retryBtn.textContent = "Reintentar enlace";
      retryBtn.title =
        "Cierra el WebRTC con este participante y envía una nueva oferta (sin salir de la reunión)";
      retryBtn.addEventListener("click", () => {
        retryPeerRenegotiate(remoteSocketId).catch((err) => console.error(err));
      });
      wrap.appendChild(cap);
      wrap.appendChild(statusEl);
      wrap.appendChild(retryBtn);
      wrap.appendChild(vid);
      $("remotesContainer").appendChild(wrap);
      remoteVideos.set(remoteSocketId, vid);
      peerStatusEls.set(remoteSocketId, statusEl);
    }

    function attachNewPeerConnection(remoteSocketId) {
      const pc = new RTCPeerConnection({ iceServers });
      pc._pendingIce = [];
      const outgoingVideo = getOutgoingVideoTrack();
      if (localStream) {
        localStream.getTracks().forEach((t) => {
          if (t.kind === "video" && outgoingVideo && outgoingVideo !== t) return;
          pc.addTrack(t, localStream);
        });
        if (outgoingVideo && (!localStream.getVideoTracks()[0] || outgoingVideo !== localStream.getVideoTracks()[0])) {
          try {
            pc.addTrack(outgoingVideo, screenShareStream || localStream);
          } catch (e) {
            console.warn("addTrack outgoing video", e);
          }
        }
        const hasLive = (kind) =>
          (kind === "video" && outgoingVideo?.readyState === "live") ||
          localStream.getTracks().filter((t) => t.kind === kind).some((t) => t.readyState === "live");
        if (!hasLive("video")) {
          try {
            pc.addTransceiver("video", { direction: "recvonly" });
          } catch (e) {
            console.warn("addTransceiver video recvonly", e);
          }
        }
      } else if (outgoingVideo) {
        try {
          pc.addTrack(outgoingVideo, screenShareStream || new MediaStream([outgoingVideo]));
        } catch (e) {
          console.warn("addTrack screen-only video", e);
        }
      }
      pc.onicecandidate = (e) => {
        if (e.candidate && activeRoomId) {
          socket.emit("webrtc:ice-candidate", {
            roomId: normRoomKey(activeRoomId),
            candidate: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate,
            targetSocketId: remoteSocketId,
          });
        }
      };
      pc.ontrack = (e) => {
        const vid = remoteVideos.get(remoteSocketId);
        if (vid) vid.srcObject = e.streams[0];
        if (isMeetingRecordingMixActive() && shouldConnectRemoteToRecordingMix()) {
          connectRemotePeerToMix(remoteSocketId);
        }
      };

      const onPcState = () => {
        updatePeerStatus(remoteSocketId);
        updateLocalAggregateStatus();
        const st = pc.connectionState;
        if (st === "failed") {
          const short = remoteSocketId.length > 8 ? remoteSocketId.slice(0, 6) + "…" : remoteSocketId;
          log("WebRTC: conexión fallida con peer " + remoteSocketId + " (ICE: " + pc.iceConnectionState + ")");
          setMediaStatus(
            "Fallo la conexión con un participante (" +
              short +
              "). Puedes pulsar «Reintentar enlace» en su tarjeta o «Reiniciar cámara y mic»."
          );
          setTimeout(() => {
            if (pcs.has(remoteSocketId) && pcs.get(remoteSocketId)?.connectionState === "failed") {
              teardownPeerPcOnly(remoteSocketId);
            }
          }, 1400);
        }
      };
      pc.addEventListener("connectionstatechange", onPcState);
      pc.addEventListener("iceconnectionstatechange", onPcState);
      pc._peerStatusHandler = onPcState;
      onPcState();

      pcs.set(remoteSocketId, pc);
      updateLocalAggregateStatus();
      return pc;
    }

    function getOrCreatePc(remoteSocketId) {
      const existing = pcs.get(remoteSocketId);
      if (existing && !peerConnectionIsDead(existing)) {
        return existing;
      }
      if (existing && peerConnectionIsDead(existing)) {
        teardownPeerPcOnly(remoteSocketId);
      }
      ensureRemotePeerUi(remoteSocketId);
      return attachNewPeerConnection(remoteSocketId);
    }

    async function flushPendingIce(pc) {
      while (pc._pendingIce?.length) {
        const c = pc._pendingIce.shift();
        try {
          await pc.addIceCandidate(new RTCIceCandidate(c));
        } catch (err) { console.warn("addIceCandidate", err); }
      }
    }

    function cleanupPeer(remoteSocketId) {
      teardownPeerPcOnly(remoteSocketId);
      const vid = remoteVideos.get(remoteSocketId);
      if (vid) {
        vid.srcObject = null;
        vid.parentElement?.remove();
        remoteVideos.delete(remoteSocketId);
      }
      peerStatusEls.delete(remoteSocketId);
      updateLocalAggregateStatus();
    }

    async function negotiateOffer(remoteSocketId) {
      const pc = getOrCreatePc(remoteSocketId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit("webrtc:offer", {
        roomId: normRoomKey(activeRoomId),
        sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp },
        targetSocketId: remoteSocketId,
      });
      updatePeerStatus(remoteSocketId);
      updateLocalAggregateStatus();
    }

    async function retryPeerRenegotiate(remoteSocketId) {
      if (!activeRoomId || !socket?.connected) return;
      log("Renegociando WebRTC con peer " + remoteSocketId);
      setMediaStatus("Renegociando enlace (nueva oferta)…");
      teardownPeerPcOnly(remoteSocketId);
      ensureRemotePeerUi(remoteSocketId);
      try {
        await negotiateOffer(remoteSocketId);
        setMediaStatus("Oferta enviada. Esperando respuesta del otro extremo.");
      } catch (e) {
        console.error(e);
        log("Renegociación: " + (e?.message || e));
        setMediaStatus("No se pudo renegociar. Prueba de nuevo o recarga la página.");
      }
    }

    async function onIncomingOffer(fromSocketId, sdp) {
      let pc = pcs.get(fromSocketId);
      if (!pc || peerConnectionIsDead(pc)) {
        pc = getOrCreatePc(fromSocketId);
      }
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      } catch (e) {
        console.warn("setRemoteDescription(offer), reintentando con PC nueva", e);
        teardownPeerPcOnly(fromSocketId);
        pc = getOrCreatePc(fromSocketId);
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      }
      await flushPendingIce(pc);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit("webrtc:answer", {
        roomId: normRoomKey(activeRoomId),
        sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp },
        targetSocketId: fromSocketId,
      });
      updatePeerStatus(fromSocketId);
      updateLocalAggregateStatus();
    }

    async function onIncomingAnswer(fromSocketId, sdp) {
      const pc = pcs.get(fromSocketId);
      if (!pc || peerConnectionIsDead(pc)) return;
      if (pc.signalingState !== "have-local-offer") return;
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      } catch (e) {
        console.warn("setRemoteDescription(answer) ignorada", e);
        return;
      }
      await flushPendingIce(pc);
      updatePeerStatus(fromSocketId);
      updateLocalAggregateStatus();
    }

    async function onIncomingIce(fromSocketId, candidate) {
      const pc = getOrCreatePc(fromSocketId);
      if (!candidate) return;
      if (!pc.remoteDescription) {
        pc._pendingIce.push(candidate);
        return;
      }
      try {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (err) {
        console.warn("ICE", err);
      }
      updatePeerStatus(fromSocketId);
      updateLocalAggregateStatus();
    }

    function drawLockedBadge(ctx, el, z) {
      const b = getElementBounds(el, ctx);
      if (!b) return;
      ctx.save();
      const fs = 12 / z;
      ctx.font = `${fs}px sans-serif`;
      ctx.textBaseline = "top";
      ctx.fillStyle = "#c2410c";
      ctx.fillText("🔒", b.x + b.w - fs * 1.15, b.y + 2 / z);
      ctx.restore();
    }

    function updateBoardLockUi() {
      const btn = $("btnBoardToggleLock");
      if (btn) {
        const show = boardTool === "pointer" && activeRoomId;
        const el = selectedElementIndex >= 0 ? boardState.elementos[selectedElementIndex] : null;
        const canLock = el && (el.type === "text" || el.type === "image");
        btn.classList.toggle("hidden", !show || !canLock);
        if (canLock) {
          btn.textContent = el.locked ? "Desbloquear objeto" : "Bloquear objeto";
        }
      }
      updateSelectionLockFloatPosition();
    }

    function updateSelectionLockFloatPosition() {
      const btn = $("btnBoardToggleLockFloat");
      const wrap = $("boardViewportWrap");
      const canvas = $("board");
      if (!btn || !wrap || !canvas) return;
      const show =
        boardTool === "pointer" &&
        activeRoomId &&
        selectedElementIndex >= 0 &&
        editingTextElementIndex < 0;
      const el = show ? boardState.elementos[selectedElementIndex] : null;
      const canLock = el && (el.type === "text" || el.type === "image");
      if (!canLock) {
        btn.classList.add("hidden");
        return;
      }
      const ctx = canvas.getContext("2d");
      const b = getElementBounds(el, ctx);
      if (!b) {
        btn.classList.add("hidden");
        return;
      }
      const z = boardZoom;
      const sx = b.x * z + boardPanX;
      const sy = b.y * z + boardPanY;
      const sw = b.w * z;
      const canvasRect = canvas.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();
      const scaleX = canvasRect.width / canvas.width;
      const scaleY = canvasRect.height / canvas.height;
      btn.textContent = el.locked ? "Desbloquear" : "Bloquear";
      btn.title = el.locked
        ? "Desbloquear objeto (o clic en el candado del objeto)"
        : "Bloquear objeto (nadie lo mueve salvo clic en candado o Alt+clic)";
      btn.classList.remove("hidden");
      const btnW = btn.offsetWidth || 76;
      let left = canvasRect.left - wrapRect.left + sx * scaleX + sw * scaleX - btnW - 4;
      let top = canvasRect.top - wrapRect.top + sy * scaleY - 30;
      const pad = 4;
      left = Math.min(Math.max(pad, left), wrapRect.width - btnW - pad);
      top = Math.min(Math.max(pad, top), wrapRect.height - 28);
      btn.style.left = `${left}px`;
      btn.style.top = `${top}px`;
    }

    function toggleSelectedElementLock() {
      if (!activeRoomId || boardTool !== "pointer" || selectedElementIndex < 0) return;
      const el = boardState.elementos[selectedElementIndex];
      if (!el || (el.type !== "text" && el.type !== "image")) return;
      const next = cloneBoardState(boardState);
      const idx = selectedElementIndex;
      next.elementos[idx] = { ...next.elementos[idx], locked: !el.locked };
      if (next.elementos[idx].locked) {
        selectedElementIndex = -1;
      }
      applyBoardState(next, { recordHistory: true, clearFuture: true, emit: true });
    }

    function getBoardElementBounds(el) {
      if (!el) return null;
      if (el.type === "stroke" && el.points?.length) {
        const xs = el.points.map((p) => p.x).filter((n) => Number.isFinite(n));
        const ys = el.points.map((p) => p.y).filter((n) => Number.isFinite(n));
        if (!xs.length || !ys.length) return null;
        const minx = Math.min(...xs);
        const maxx = Math.max(...xs);
        const miny = Math.min(...ys);
        const maxy = Math.max(...ys);
        return { x: minx, y: miny, w: Math.max(1, maxx - minx), h: Math.max(1, maxy - miny) };
      }
      if (el.type === "text") {
        const x = Number(el.x) || 0;
        const y = Number(el.y) || 0;
        return { x, y, w: 220, h: 64 };
      }
      if (el.type === "image") {
        const x = Number(el.x) || 0;
        const y = Number(el.y) || 0;
        const w = Math.max(1, Number(el.w) || 100);
        const h = Math.max(1, Number(el.h) || 100);
        return { x, y, w, h };
      }
      return null;
    }

    function getBoardWorldBounds(options = {}) {
      const includeViewport = options.includeViewport !== false;
      const canvas = $("board");
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      const add = (x, y, w, h) => {
        if (![x, y, w, h].every(Number.isFinite)) return;
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x + Math.max(1, w));
        maxY = Math.max(maxY, y + Math.max(1, h));
      };
      if (includeViewport && canvas && boardZoom > 0) {
        add((-boardPanX) / boardZoom, (-boardPanY) / boardZoom, canvas.width / boardZoom, canvas.height / boardZoom);
      }
      for (const el of boardState.elementos || []) {
        const b = getBoardElementBounds(el);
        if (b) add(b.x, b.y, b.w, b.h);
      }
      if (!Number.isFinite(minX)) {
        return {
          minX: -BOARD_DEFAULT_VIEW_W / 2,
          minY: -BOARD_DEFAULT_VIEW_H / 2,
          maxX: BOARD_DEFAULT_VIEW_W / 2,
          maxY: BOARD_DEFAULT_VIEW_H / 2,
        };
      }
      const pad = 120;
      return { minX: minX - pad, minY: minY - pad, maxX: maxX + pad, maxY: maxY + pad };
    }

    function drawBoard() {
      const canvas = $("board");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const cw = canvas.width;
      const ch = canvas.height;
      const z = boardZoom;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(0, 0, cw, ch);
      ctx.setTransform(z, 0, 0, z, boardPanX, boardPanY);
      // Tablero "infinito": pintamos fondo y cuadrícula en todo el viewport visible (sin borde final).
      const worldLeft = (-boardPanX) / z;
      const worldTop = (-boardPanY) / z;
      const worldRight = worldLeft + cw / z;
      const worldBottom = worldTop + ch / z;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(worldLeft, worldTop, worldRight - worldLeft, worldBottom - worldTop);
      const GRID_STEP = 40;
      const DOT_R = 0.95 / z;
      const startX = Math.floor(worldLeft / GRID_STEP) * GRID_STEP;
      const startY = Math.floor(worldTop / GRID_STEP) * GRID_STEP;
      ctx.fillStyle = "rgba(15, 23, 42, 0.14)";
      for (let gx = startX; gx <= worldRight; gx += GRID_STEP) {
        for (let gy = startY; gy <= worldBottom; gy += GRID_STEP) {
          ctx.beginPath();
          ctx.arc(gx, gy, DOT_R, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      const els = boardState.elementos || [];
      for (let idx = 0; idx < els.length; idx++) {
        const el = els[idx];
        if (el.type === "stroke" && el.points?.length) {
          ctx.strokeStyle = el.color || "#111";
          ctx.lineWidth = (el.lineWidth || 2) / z;
          ctx.beginPath();
          ctx.moveTo(el.points[0].x, el.points[0].y);
          for (let i = 1; i < el.points.length; i++) {
            ctx.lineTo(el.points[i].x, el.points[i].y);
          }
          ctx.stroke();
        } else if (el.type === "text" && el.text) {
          if (editingTextElementIndex >= 0 && idx === editingTextElementIndex) continue;
          drawBoardTextElement(ctx, el, z);
        } else if (el.type === "image" && el.src) {
          const cached = boardImageCache.get(el.src);
            if (cached?.ready) {
            ctx.drawImage(cached.image, el.x || 0, el.y || 0, el.w || 100, el.h || 100);
          } else if (!cached?.loading) {
            const image = new Image();
            boardImageCache.set(el.src, { loading: true, ready: false, image });
            image.onload = () => {
              boardImageCache.set(el.src, { loading: false, ready: true, image });
              drawBoard();
            };
            image.onerror = () => {
              boardImageCache.delete(el.src);
            };
            image.src = el.src;
          }
        }
      }
      for (let idx = 0; idx < els.length; idx++) {
        const el = els[idx];
        if (!el?.locked || (el.type !== "text" && el.type !== "image")) continue;
        if (el.type === "text" && editingTextElementIndex >= 0 && idx === editingTextElementIndex) continue;
        drawLockedBadge(ctx, el, z);
      }
      drawSelectionOverlay(ctx);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      drawMinimap();
      updateBoardLockUi();
    }

    function screenToWorld(sx, sy) {
      return {
        x: (sx - boardPanX) / boardZoom,
        y: (sy - boardPanY) / boardZoom,
      };
    }

    function centerCamera(opts = {}) {
      const emit = opts.emit !== false;
      const canvas = $("board");
      if (!canvas) return;
      const b = getBoardWorldBounds({ includeViewport: false });
      const cx = (b.minX + b.maxX) / 2;
      const cy = (b.minY + b.maxY) / 2;
      boardPanX = canvas.width / 2 - cx * boardZoom;
      boardPanY = canvas.height / 2 - cy * boardZoom;
      if (emit) scheduleEmitPresenterView();
    }

    function getDefaultBoardZoom() {
      const canvas = $("board");
      if (!canvas) return 1;
      const fit = Math.min(canvas.width / BOARD_DEFAULT_VIEW_W, canvas.height / BOARD_DEFAULT_VIEW_H);
      if (!Number.isFinite(fit) || fit <= 0) return 1;
      const zoom = fit * 1.65;
      return Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom));
    }

    function resetBoardCamera(opts = {}) {
      const emit = opts.emit !== false;
      boardZoom = getDefaultBoardZoom();
      centerCamera({ emit });
      syncZoomUi();
      drawBoard();
    }

    function resizeBoardCanvasToViewport(opts = {}) {
      const preserveCenter = opts.preserveCenter !== false;
      const resetCamera = opts.resetCamera === true;
      const wrap = $("boardViewportWrap");
      const canvas = $("board");
      if (!wrap || !canvas) return;
      const targetCssW = Math.max(320, Math.floor(wrap.clientWidth || 0));
      const targetCssH = Math.max(220, Math.floor(wrap.clientHeight || 0));
      if (targetCssW <= 0 || targetCssH <= 0) return;

      let centerWorld = null;
      if (preserveCenter && boardZoom > 0 && Number.isFinite(boardPanX) && Number.isFinite(boardPanY)) {
        centerWorld = {
          x: (canvas.width / 2 - boardPanX) / boardZoom,
          y: (canvas.height / 2 - boardPanY) / boardZoom,
        };
      }
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      const targetW = Math.max(1, Math.round(targetCssW * dpr));
      const targetH = Math.max(1, Math.round(targetCssH * dpr));
      const changed = canvas.width !== targetW || canvas.height !== targetH;
      canvas.style.width = targetCssW + "px";
      canvas.style.height = targetCssH + "px";
      if (changed) {
        canvas.width = targetW;
        canvas.height = targetH;
      }
      if (resetCamera) {
        resetBoardCamera({ emit: false });
      } else if (changed && centerWorld && boardZoom > 0) {
        boardPanX = canvas.width / 2 - centerWorld.x * boardZoom;
        boardPanY = canvas.height / 2 - centerWorld.y * boardZoom;
      }
      syncZoomUi();
      drawBoard();
    }

    function isRoomDocente() {
      const u = currentUser?.usuarioId;
      const d = roomDocenteUsuarioId;
      if (u == null || d == null) return false;
      return String(u).trim().toLowerCase() === String(d).trim().toLowerCase();
    }

    function isBoardViewLocked() {
      return boardFollowRoomActive && followingPresenter && !isRoomDocente();
    }

    function applyPresenterViewFromRemote(view) {
      if (!view || !Number.isFinite(view.boardZoom)) return;
      boardPanX = view.boardPanX;
      boardPanY = view.boardPanY;
      boardZoom = view.boardZoom;
      syncZoomUi();
      drawBoard();
    }

    function emitPresenterViewPayload() {
      socket.emit("board:view", {
        roomId: normRoomKey(activeRoomId),
        view: { boardPanX, boardPanY, boardZoom },
      });
    }

    /** Envío inmediato al activar «seguir» para que la audiencia reciba la primera vista sin esperar al throttle. */
    function emitPresenterViewImmediate() {
      if (!activeRoomId || !socket?.connected || !presenterFollowLeadActive || !isRoomDocente()) return;
      emitPresenterViewPayload();
    }

    function scheduleEmitPresenterView() {
      if (!activeRoomId || !socket || !presenterFollowLeadActive || !isRoomDocente()) return;
      if (presenterViewEmitTimer) return;
      presenterViewEmitTimer = setTimeout(() => {
        presenterViewEmitTimer = null;
        emitPresenterViewPayload();
      }, 75);
    }

    function updateBoardFollowUi() {
      const btn = $("btnBoardFollowLead");
      const status = $("boardFollowStatus");
      if (!btn || !status) return;
      const inRoom = !!activeRoomId;
      const docente = isRoomDocente();
      btn.classList.toggle("hidden", !inRoom || !docente);
      if (docente) {
        btn.textContent = presenterFollowLeadActive
          ? "Audiencia me sigue — liberar vista"
          : "Hacer que la audiencia siga mi vista";
        btn.setAttribute("aria-pressed", presenterFollowLeadActive ? "true" : "false");
      }
      if (boardFollowRoomActive && followingPresenter && !docente) {
        status.textContent =
          "Estás viendo la vista del docente (no puedes mover el tablero hasta que libere la vista).";
        status.style.display = "block";
      } else if (presenterFollowLeadActive && docente) {
        status.textContent = "Los estudiantes ven tu mismo zoom y posición del tablero.";
        status.style.display = "block";
      } else {
        status.textContent = "";
        status.style.display = "none";
      }
    }

    /** Controles de grabación de vídeo: solo el docente dueño de la reunión (`roomDocenteUsuarioId`). */
    function updateTeacherRecordingControlsVisibility() {
      const show = !!(activeRoomId && isRoomDocente());
      const btnV = $("btnRecordMeetingVideo");
      const split = $("recordSplit");
      const labLayout = $("recordVideoLayoutLabel");
      const selLayout = $("recordVideoLayoutSelect");
      const mixSel = $("recordMixModeSelect");
      if (btnV) {
        btnV.classList.toggle("hidden", !show);
        btnV.setAttribute("aria-hidden", show ? "false" : "true");
      }
      if (split) {
        split.classList.toggle("hidden", !show);
        split.setAttribute("aria-hidden", show ? "false" : "true");
      }
      if (labLayout) {
        labLayout.classList.toggle("hidden", !show);
        labLayout.setAttribute("aria-hidden", show ? "false" : "true");
      }
      if (selLayout) {
        selLayout.classList.toggle("hidden", !show);
        selLayout.setAttribute("aria-hidden", show ? "false" : "true");
      }
      if (mixSel) {
        mixSel.classList.toggle("hidden", !show);
        mixSel.setAttribute("aria-hidden", show ? "false" : "true");
      }
      if (!show && isMeetingVideoRecordingActive()) {
        stopMeetingVideoRecording({ download: false }).catch(() => {});
      }
      updateMeetingVideoRecordButton();
    }

    function setBoardZoomAnchored(newZoom, anchorSX, anchorSY) {
      if (isBoardViewLocked()) return;
      const canvas = $("board");
      if (!canvas) return;
      const cw = canvas.width;
      const ch = canvas.height;
      const ax = anchorSX != null ? anchorSX : cw / 2;
      const ay = anchorSY != null ? anchorSY : ch / 2;
      const wx = (ax - boardPanX) / boardZoom;
      const wy = (ay - boardPanY) / boardZoom;
      const nz = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
      boardPanX = ax - wx * nz;
      boardPanY = ay - wy * nz;
      boardZoom = nz;
      syncZoomUi();
      drawBoard();
      scheduleEmitPresenterView();
    }

    function syncZoomUi() {
      const raw = Math.round(boardZoom * 100);
      const nearest = Math.max(10, Math.min(300, Math.round(raw / 10) * 10));
      const btn = $("btnZoomReset");
      if (btn) btn.textContent = raw + "%";
      const sel = $("boardZoomSelect");
      if (sel && !sel._zoomSyncing) {
        sel._zoomSyncing = true;
        if ([...sel.options].some((o) => Number(o.value) === nearest)) {
          sel.value = String(nearest);
        }
        sel._zoomSyncing = false;
      }
    }

    function drawMinimap() {
      const mini = $("boardMinimap");
      const canvas = $("board");
      if (!mini || mini.classList.contains("hidden-map") || !canvas) return;
      const mw = mini.width;
      const mh = mini.height;
      const ctx = mini.getContext("2d");
      ctx.fillStyle = "#f1f5f9";
      ctx.fillRect(0, 0, mw, mh);
      ctx.strokeStyle = "#94a3b8";
      ctx.strokeRect(0, 0, mw, mh);
      const b = getBoardWorldBounds({ includeViewport: true });
      const worldW = Math.max(1, b.maxX - b.minX);
      const worldH = Math.max(1, b.maxY - b.minY);
      const fitScale = Math.min(mw / worldW, mh / worldH);
      const drawW = worldW * fitScale;
      const drawH = worldH * fitScale;
      const ox = (mw - drawW) / 2;
      const oy = (mh - drawH) / 2;
      minimapWorldRect = { minX: b.minX, minY: b.minY, scale: fitScale, offsetX: ox, offsetY: oy };
      ctx.fillStyle = "rgba(148, 163, 184, 0.2)";
      ctx.fillRect(ox, oy, drawW, drawH);
      const mapX = (wx) => ox + (wx - b.minX) * fitScale;
      const mapY = (wy) => oy + (wy - b.minY) * fitScale;
      const els = boardState.elementos || [];
      ctx.fillStyle = "rgba(100, 116, 139, 0.55)";
      for (const el of els) {
        const eb = getBoardElementBounds(el);
        if (!eb) continue;
        const x = mapX(eb.x);
        const y = mapY(eb.y);
        const w = Math.max(2, eb.w * fitScale);
        const h = Math.max(2, eb.h * fitScale);
        ctx.fillRect(x, y, w, h);
      }
      const vl = -boardPanX / boardZoom;
      const vt = -boardPanY / boardZoom;
      const vw = canvas.width / boardZoom;
      const vh = canvas.height / boardZoom;
      ctx.strokeStyle = "#2563eb";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(mapX(vl), mapY(vt), Math.max(1, vw * fitScale), Math.max(1, vh * fitScale));
    }

    function populateBoardZoomSelect() {
      const sel = $("boardZoomSelect");
      if (!sel || sel.dataset.populated) return;
      sel.dataset.populated = "1";
      for (let p = 10; p <= 300; p += 10) {
        const opt = document.createElement("option");
        opt.value = String(p);
        opt.textContent = p + "%";
        sel.appendChild(opt);
      }
    }

    function refreshBoardCursor() {
      const c = $("board");
      if (!c) return;
      if (boardTool === "hand") {
        c.style.cursor = handDrag ? "grabbing" : "grab";
      } else if (boardTool === "text") {
        c.style.cursor = "text";
      } else if (boardTool === "pointer") {
        c.style.cursor = "default";
      } else {
        c.style.cursor = "crosshair";
      }
    }

    function cloneBoardState(state) {
      return {
        elementos: (state?.elementos || []).map((el) => ({
          ...el,
          points: (el.points || []).map((p) => ({ x: p.x, y: p.y })),
        })),
      };
    }

    function updateBoardHistoryButtons() {
      const undo = $("btnBoardUndo");
      const redo = $("btnBoardRedo");
      if (undo) undo.disabled = boardHistory.length === 0;
      if (redo) redo.disabled = boardFuture.length === 0;
    }

    function updateBoardToolUi() {
      $("btnToolPointer")?.classList.toggle("active", boardTool === "pointer");
      $("btnToolHand")?.classList.toggle("active", boardTool === "hand");
      $("btnToolPencil")?.classList.toggle("active", boardTool === "pencil");
      $("btnToolEraser")?.classList.toggle("active", boardTool === "eraser");
      $("btnToolText")?.classList.toggle("active", boardTool === "text");
      refreshBoardCursor();
      const swatches = document.querySelectorAll(".color-swatch");
      swatches.forEach((el) => {
        el.classList.toggle("active", (el.dataset.color || "").toLowerCase() === boardColor.toLowerCase());
      });
      const colorInput = $("boardColor");
      if (colorInput && colorInput.value.toLowerCase() !== boardColor.toLowerCase()) {
        colorInput.value = boardColor;
      }
      updateBoardLockUi();
    }

    function applyBoardState(nextState, opts = {}) {
      const { recordHistory = false, clearFuture = false, emit = false } = opts;
      if (recordHistory) {
        boardHistory.push(cloneBoardState(boardState));
        if (boardHistory.length > BOARD_HISTORY_LIMIT) boardHistory.shift();
      }
      if (clearFuture) {
        boardFuture.length = 0;
      }
      boardState = cloneBoardState(nextState || { elementos: [] });
      if (selectedElementIndex >= boardState.elementos.length) selectedElementIndex = -1;
      drawBoard();
      updateBoardHistoryButtons();
      if (emit) emitBoardUpdate();
    }

    function mergeBoardContenido(contenido) {
      if (!contenido || !Array.isArray(contenido.elementos)) return;
      boardHistory.length = 0;
      boardFuture.length = 0;
      applyBoardState(contenido, { recordHistory: false, clearFuture: false, emit: false });
    }

    function emitBoardUpdate() {
      if (!activeRoomId || !socket) return;
      socket.emit("board:update", { roomId: normRoomKey(activeRoomId), contenido: boardState });
    }

    function performBoardUndo() {
      if (boardHistory.length === 0) return;
      boardFuture.push(cloneBoardState(boardState));
      if (boardFuture.length > BOARD_HISTORY_LIMIT) boardFuture.shift();
      const prev = boardHistory.pop();
      applyBoardState(prev, { emit: true });
    }

    function performBoardRedo() {
      if (boardFuture.length === 0) return;
      boardHistory.push(cloneBoardState(boardState));
      if (boardHistory.length > BOARD_HISTORY_LIMIT) boardHistory.shift();
      const next = boardFuture.pop();
      applyBoardState(next, { emit: true });
    }

    function appendChatLine(payload) {
      const m = payload.mensaje;
      if (!m) return;
      const autor = m.autor || null;
      const destinatario = m.destinatario || null;
      if (autor?.usuarioId) {
        participantsById.set(autor.usuarioId, autor);
      }
      if (destinatario?.usuarioId) {
        participantsById.set(destinatario.usuarioId, destinatario);
      }

      let threadKey = "general";
      if (m.tipo === "privado") {
        const selfId = currentUser?.usuarioId;
        const isMine = selfId && autor?.usuarioId === selfId;
        const peerId = isMine
          ? (m.destinatarioUsuarioId || destinatario?.usuarioId)
          : autor?.usuarioId;
        if (peerId) {
          threadKey = `dm:${peerId}`;
          if (!chatThreads.has(threadKey)) {
            const peer = participantsById.get(peerId);
            const label = peer?.nombre || `Usuario ${String(peerId).slice(0, 8)}`;
            chatThreads.set(threadKey, {
              key: threadKey,
              type: "dm",
              targetUserId: peerId,
              label,
              messages: [],
              unread: 0,
            });
          }
        }
      } else {
        ensureGeneralThread();
      }

      const thread = chatThreads.get(threadKey);
      if (!thread) return;
      thread.messages.push(m);
      if (activeChatThreadKey !== threadKey) {
        thread.unread = (thread.unread || 0) + 1;
      }
      renderChatThreadTabs();
      renderChatMessages();
      refreshChatThreadPicker();
    }

    function ensureGeneralThread() {
      if (!chatThreads.has("general")) {
        chatThreads.set("general", {
          key: "general",
          type: "general",
          label: "General",
          targetUserId: null,
          messages: [],
          unread: 0,
        });
      }
    }

    function setActiveChatThread(threadKey) {
      if (!chatThreads.has(threadKey)) return;
      activeChatThreadKey = threadKey;
      const thread = chatThreads.get(threadKey);
      thread.unread = 0;
      renderChatThreadTabs();
      renderChatMessages();
    }

    function closeChatThread(threadKey) {
      const thread = chatThreads.get(threadKey);
      if (!thread || thread.type !== "dm") return;
      chatThreads.delete(threadKey);
      if (activeChatThreadKey === threadKey) {
        activeChatThreadKey = "general";
      }
      renderChatThreadTabs();
      renderChatMessages();
      refreshChatThreadPicker();
    }

    function renderChatThreadTabs() {
      const container = $("chatThreadTabs");
      if (!container) return;
      container.innerHTML = "";
      const ordered = [...chatThreads.values()].sort((a, b) => {
        if (a.key === "general") return -1;
        if (b.key === "general") return 1;
        return a.label.localeCompare(b.label, "es");
      });
      ordered.forEach((t) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chat-tab" + (t.key === activeChatThreadKey ? " active" : "");
        btn.textContent = t.label;
        if (t.unread > 0) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = String(t.unread);
          btn.appendChild(badge);
        }
        if (t.type === "dm") {
          const closeBtn = document.createElement("button");
          closeBtn.type = "button";
          closeBtn.className = "chat-tab-close";
          closeBtn.title = `Cerrar chat con ${t.label}`;
          closeBtn.textContent = "×";
          closeBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            closeChatThread(t.key);
          });
          btn.appendChild(closeBtn);
        }
        btn.addEventListener("click", () => setActiveChatThread(t.key));
        container.appendChild(btn);
      });
    }

    function renderChatMessages() {
      const box = $("chatBox");
      if (!box) return;
      box.innerHTML = "";
      const thread = chatThreads.get(activeChatThreadKey);
      if (!thread) return;
      thread.messages.forEach((m) => {
        const div = document.createElement("div");
        const autor = m.autor?.nombre || m.autor?.usuarioId || "?";
        const tipo = m.tipo === "privado" ? " (privado)" : "";
        div.className = m.tipo === "privado" ? "msg-privado" : "";
        const tstr = new Date(m.marcaTiempo || Date.now()).toLocaleTimeString();
        div.appendChild(
          document.createTextNode(`[${tstr}] ${autor}${tipo}: `)
        );
        if (m.adjuntoRelPath && m.mensajeId) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "chat-adjunto-btn";
          btn.textContent = `📎 ${m.adjuntoNombreOriginal || "archivo"}`;
          btn.title = "Descargar adjunto";
          btn.addEventListener("click", () =>
            downloadChatAdjunto(m.mensajeId, m.adjuntoNombreOriginal || "adjunto")
          );
          div.appendChild(btn);
        }
        const cap = document.createElement("span");
        cap.textContent = m.contenido || "";
        div.appendChild(cap);
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }
