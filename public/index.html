<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Own Zoom — Cliente</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 1rem; max-width: 960px; margin-inline: auto; }
    h1 { font-size: 1.25rem; }
    fieldset { border: 1px solid #ccc; margin-bottom: 1rem; padding: 0.75rem; }
    label { display: block; margin: 0.35rem 0 0.15rem; }
    input, button, select { font: inherit; padding: 0.35rem 0.5rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.35rem 0; }
    #log { font-size: 0.85rem; color: #444; white-space: pre-wrap; min-height: 1.5rem; }
    #videos { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0; }
    #videos video { width: 240px; max-width: 100%; background: #111; border-radius: 6px; }
    .remote-peer { margin-bottom: 0.5rem; }
    .peer-conn-status { font-size: 0.72rem; color: #555; margin: 0.15rem 0 0.25rem; font-variant-numeric: tabular-nums; }
    .peer-retry-btn { font-size: 0.72rem; margin-top: 0.2rem; }
    .room-controls button[data-off="true"] { opacity: 0.65; }
    #mediaStatus { font-size: 0.85rem; color: #333; margin: 0.25rem 0; }
    #chatBox { border: 1px solid #ccc; height: 180px; overflow-y: auto; padding: 0.5rem; margin: 0.5rem 0; font-size: 0.9rem; }
    #board { touch-action: none; cursor: crosshair; border: 1px solid #333; border-radius: 4px; max-width: 100%; }
    .msg-privado { color: #6a1b9a; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>My Own Zoom — MVP</h1>
  <p id="log"></p>

  <section id="authSection">
    <fieldset>
      <legend>Entrar</legend>
      <div class="row">
        <label>Email <input id="email" type="email" autocomplete="username" /></label>
        <label>Contraseña <input id="password" type="password" autocomplete="current-password" /></label>
      </div>
      <div class="row">
        <button type="button" id="btnLogin">Iniciar sesión</button>
        <button type="button" id="btnRegister">Registrarse</button>
        <label>Rol (registro) <select id="rolRegistro"><option value="estudiante">Estudiante</option><option value="docente">Docente</option></select></label>
        <label>Nombre <input id="nombre" placeholder="Tu nombre" /></label>
      </div>
    </fieldset>
  </section>

  <section id="lobbySection" class="hidden">
    <fieldset>
      <legend>Sala</legend>
      <p>Usuario: <strong id="userLabel"></strong></p>
      <p style="font-size:0.9rem;color:#444">Cupo por sala: <strong>1 docente</strong> (dueño) + <strong>5 estudiantes</strong> (6 personas en total).</p>
      <div class="row">
        <button type="button" id="btnLogout">Cerrar sesión</button>
      </div>
      <div class="row">
        <button type="button" id="btnCrearReunion">Crear reunión (docente)</button>
        <span id="crearResult"></span>
      </div>
      <div class="row">
        <label>Room ID (UUID de la reunión) <input id="roomIdInput" placeholder="pega room_id" style="min-width:280px" /></label>
        <button type="button" id="btnUnirseApi">Unirse (API)</button>
        <button type="button" id="btnConsultarCupo">Consultar cupo</button>
        <button type="button" id="btnEntrarSala">Entrar a la sala (Socket + WebRTC)</button>
      </div>
      <p id="cupoInfo" style="font-size:0.9rem"></p>
    </fieldset>
  </section>

  <section id="roomSection" class="hidden">
    <fieldset>
      <legend>En reunión</legend>
      <p>Sala: <code id="activeRoomLabel"></code></p>
      <div class="row room-controls" id="roomMediaControls">
        <button type="button" id="btnToggleMic" title="Silenciar o activar micrófono">Micrófono: encendido</button>
        <button type="button" id="btnToggleCam" title="Apagar o encender cámara">Cámara: encendida</button>
        <button type="button" id="btnReiniciarMedios" title="Vuelve a pedir cámara y micrófono y actualiza lo que envías">
          Reiniciar cámara y mic
        </button>
        <button type="button" id="btnSalirSala">Colgar y salir de la reunión</button>
      </div>
      <p id="mediaStatus" aria-live="polite"></p>
      <div id="videos">
        <div class="remote-peer">
          <div>Local</div>
          <video id="localVideo" autoplay playsinline muted></video>
          <div id="localConnStatus" class="peer-conn-status" aria-live="polite"></div>
        </div>
        <div id="remotesContainer"></div>
      </div>
      <h2>Chat</h2>
      <div class="row">
        <select id="chatTipo"><option value="general">General</option><option value="privado">Privado (estudiante→docente o docente→estudiante)</option></select>
        <input id="destinatarioId" class="hidden" placeholder="usuarioId destinatario (docente)" style="min-width:260px" />
      </div>
      <div id="chatBox"></div>
      <div class="row">
        <input id="chatInput" placeholder="Mensaje" style="flex:1;min-width:200px" />
        <button type="button" id="btnEnviarChat">Enviar</button>
      </div>
      <h2>Tablero</h2>
      <p style="font-size:0.85rem">Dibuja con el ratón; se sincroniza con la sala.</p>
      <canvas id="board" width="640" height="360"></canvas>
    </fieldset>
  </section>

  <script>
    const LS = "moj_token";
    const api = (path, opts = {}) =>
      fetch(path, {
        ...opts,
        headers: {
          "Content-Type": "application/json",
          ...(opts.headers || {}),
          ...(getToken() ? { Authorization: "Bearer " + getToken() } : {}),
        },
      }).then(async (r) => {
        const text = await r.text();
        let data;
        try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
        if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { status: r.status, data });
        return data;
      });

    function getToken() { return localStorage.getItem(LS); }
    function setToken(t) { if (t) localStorage.setItem(LS, t); else localStorage.removeItem(LS); }
    function log(msg) {
      const el = document.getElementById("log");
      el.textContent = typeof msg === "string" ? msg : JSON.stringify(msg, null, 2);
    }

    function setMediaStatus(text) {
      const el = $("mediaStatus");
      if (el) el.textContent = text || "";
    }

    function humanizeGetUserMediaError(err) {
      const name = err?.name || "";
      if (name === "NotAllowedError" || name === "PermissionDeniedError") {
        return "Permiso denegado para cámara o micrófono. Revisa los permisos del navegador para este sitio.";
      }
      if (name === "NotFoundError" || name === "DevicesNotFoundError") {
        return "No se encontró cámara o micrófono. Conecta un dispositivo e inténtalo de nuevo.";
      }
      if (name === "NotReadableError" || name === "TrackStartError") {
        return "La cámara o el micrófono están en uso por otra aplicación. Ciérrala e inténtalo de nuevo.";
      }
      if (name === "OverconstrainedError") {
        return "Ningún dispositivo cumple los requisitos solicitados.";
      }
      return err?.message || "No se pudo acceder a cámara o micrófono.";
    }

    let socket = null;
    let localStream = null;
    let iceServers = [{ urls: "stun:stun.l.google.com:19302" }];
    /** @type {Map<string, RTCPeerConnection>} */
    const pcs = new Map();
    /** @type {Map<string, HTMLVideoElement>} */
    const remoteVideos = new Map();
    /** @type {Map<string, HTMLElement>} */
    const peerStatusEls = new Map();
    let activeRoomId = null;
    let boardState = { elementos: [] };
    let drawing = false;
    let currentStroke = null;

    const $ = (id) => document.getElementById(id);

    async function loadIce() {
      try {
        const r = await fetch("/api/rtc/config");
        const j = await r.json();
        if (j.iceServers?.length) iceServers = j.iceServers;
      } catch (e) { console.warn("ICE config", e); }
    }

    function showLobby() {
      $("authSection").classList.add("hidden");
      $("lobbySection").classList.remove("hidden");
      $("roomSection").classList.add("hidden");
    }
    function showAuth() {
      $("authSection").classList.remove("hidden");
      $("lobbySection").classList.add("hidden");
      $("roomSection").classList.add("hidden");
    }
    function showRoom() {
      $("roomSection").classList.remove("hidden");
    }

    function stopLocalMedia() {
      if (localStream) {
        localStream.getTracks().forEach((t) => {
          try {
            t.stop();
          } catch (_) {}
        });
        localStream = null;
      }
      const lv = $("localVideo");
      if (lv) lv.srcObject = null;
      syncMediaButtons();
    }

    function syncMediaButtons() {
      const btnMic = $("btnToggleMic");
      const btnCam = $("btnToggleCam");
      if (!btnMic || !btnCam) return;
      const a = localStream?.getAudioTracks()[0];
      const v = localStream?.getVideoTracks()[0];
      const micOn = !!(a && a.readyState === "live" && a.enabled);
      const camOn = !!(v && v.readyState === "live" && v.enabled);
      btnMic.textContent = micOn ? "Micrófono: encendido" : "Micrófono: silenciado";
      btnCam.textContent = camOn ? "Cámara: encendida" : "Cámara: apagada";
      btnMic.dataset.off = micOn ? "false" : "true";
      btnCam.dataset.off = camOn ? "false" : "true";
    }

    function setMicEnabled(on) {
      if (!localStream) return;
      localStream.getAudioTracks().forEach((t) => {
        t.enabled = on;
      });
      syncMediaButtons();
    }

    function setCamEnabled(on) {
      if (!localStream) return;
      localStream.getVideoTracks().forEach((t) => {
        t.enabled = on;
      });
      syncMediaButtons();
    }

    async function syncLocalTracksToAllSenders() {
      if (!localStream || pcs.size === 0) return;
      const audio = localStream.getAudioTracks()[0] ?? null;
      const video = localStream.getVideoTracks()[0] ?? null;
      for (const [, pc] of pcs) {
        for (const sender of pc.getSenders()) {
          const cur = sender.track;
          if (!cur || typeof sender.replaceTrack !== "function") continue;
          try {
            if (cur.kind === "audio") {
              await sender.replaceTrack(audio);
            } else if (cur.kind === "video") {
              await sender.replaceTrack(video);
            }
          } catch (e) {
            console.warn("replaceTrack", e);
          }
        }
      }
    }

    function peerConnectionIsDead(pc) {
      if (!pc) return true;
      const cs = pc.connectionState;
      const ics = pc.iceConnectionState;
      return cs === "failed" || cs === "closed" || ics === "failed" || ics === "closed";
    }

    function updatePeerStatus(remoteSocketId) {
      const pc = pcs.get(remoteSocketId);
      const el = peerStatusEls.get(remoteSocketId);
      if (!el) return;
      if (!pc) {
        el.textContent = "Sin enlace activo · Pulsa «Reintentar enlace»";
        return;
      }
      const cs = pc.connectionState || "?";
      const ics = pc.iceConnectionState || "?";
      el.textContent = "Conexión: " + cs + " · ICE: " + ics;
    }

    function updateLocalAggregateStatus() {
      const el = $("localConnStatus");
      if (!el) return;
      if (!activeRoomId) {
        el.textContent = "";
        return;
      }
      if (pcs.size === 0) {
        el.textContent = "Enlaces WebRTC: ninguno (esperando participantes)";
        return;
      }
      const parts = [];
      for (const [id, pc] of pcs) {
        const short = id.length > 8 ? id.slice(0, 6) + "…" : id;
        parts.push(short + " " + pc.connectionState + "/" + pc.iceConnectionState);
      }
      el.textContent = "Tus enlaces (" + pcs.size + "): " + parts.join(" · ");
    }

    async function ensureLocalStream() {
      let acquiredNew = false;
      if (localStream) {
        const a = localStream.getAudioTracks()[0];
        const v = localStream.getVideoTracks()[0];
        if (a?.readyState === "live" || v?.readyState === "live") {
          $("localVideo").srcObject = localStream;
          syncMediaButtons();
          return localStream;
        }
        stopLocalMedia();
      }
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: { echoCancellation: true, noiseSuppression: true },
        });
        acquiredNew = true;
      } catch (e) {
        setMediaStatus(humanizeGetUserMediaError(e));
        throw e;
      }
      $("localVideo").srcObject = localStream;
      setMediaStatus("");
      syncMediaButtons();
      if (acquiredNew && pcs.size > 0) {
        try {
          await syncLocalTracksToAllSenders();
        } catch (e) {
          console.warn(e);
        }
      }
      updateLocalAggregateStatus();
      return localStream;
    }

    async function reiniciarMediosEnReunion() {
      if (!activeRoomId) return;
      setMediaStatus("Reiniciando cámara y micrófono…");
      try {
        if (localStream) {
          localStream.getTracks().forEach((t) => {
            try {
              t.stop();
            } catch (_) {}
          });
          localStream = null;
        }
        $("localVideo").srcObject = null;
        await ensureLocalStream();
        setMediaStatus("Medios reiniciados; tracks actualizados en los enlaces activos.");
      } catch (e) {
        const msg = humanizeGetUserMediaError(e);
        setMediaStatus(msg);
        log("Reiniciar medios: " + msg);
      }
    }

    function teardownPeerPcOnly(remoteSocketId) {
      const pc = pcs.get(remoteSocketId);
      if (pc) {
        if (pc._peerStatusHandler) {
          pc.removeEventListener("connectionstatechange", pc._peerStatusHandler);
          pc.removeEventListener("iceconnectionstatechange", pc._peerStatusHandler);
          delete pc._peerStatusHandler;
        }
        try {
          pc.close();
        } catch (_) {}
        pcs.delete(remoteSocketId);
      }
      const vid = remoteVideos.get(remoteSocketId);
      if (vid) vid.srcObject = null;
      updatePeerStatus(remoteSocketId);
      updateLocalAggregateStatus();
    }

    function ensureRemotePeerUi(remoteSocketId) {
      if (remoteVideos.has(remoteSocketId)) return;
      const vid = document.createElement("video");
      vid.autoplay = true;
      vid.playsInline = true;
      vid.dataset.peer = remoteSocketId;
      const wrap = document.createElement("div");
      wrap.className = "remote-peer";
      const cap = document.createElement("div");
      cap.textContent = "Participante remoto";
      const statusEl = document.createElement("div");
      statusEl.className = "peer-conn-status";
      statusEl.textContent = "Conexión: nueva · ICE: nueva";
      const retryBtn = document.createElement("button");
      retryBtn.type = "button";
      retryBtn.className = "peer-retry-btn";
      retryBtn.textContent = "Reintentar enlace";
      retryBtn.title =
        "Cierra el WebRTC con este participante y envía una nueva oferta (sin salir de la reunión)";
      retryBtn.addEventListener("click", () => {
        retryPeerRenegotiate(remoteSocketId).catch((err) => console.error(err));
      });
      wrap.appendChild(cap);
      wrap.appendChild(statusEl);
      wrap.appendChild(retryBtn);
      wrap.appendChild(vid);
      $("remotesContainer").appendChild(wrap);
      remoteVideos.set(remoteSocketId, vid);
      peerStatusEls.set(remoteSocketId, statusEl);
    }

    function attachNewPeerConnection(remoteSocketId) {
      const pc = new RTCPeerConnection({ iceServers });
      pc._pendingIce = [];
      if (localStream) {
        localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
      }
      pc.onicecandidate = (e) => {
        if (e.candidate && activeRoomId) {
          socket.emit("webrtc:ice-candidate", {
            roomId: activeRoomId,
            candidate: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate,
            targetSocketId: remoteSocketId,
          });
        }
      };
      pc.ontrack = (e) => {
        const vid = remoteVideos.get(remoteSocketId);
        if (vid) vid.srcObject = e.streams[0];
      };

      const onPcState = () => {
        updatePeerStatus(remoteSocketId);
        updateLocalAggregateStatus();
        const st = pc.connectionState;
        if (st === "failed") {
          const short = remoteSocketId.length > 8 ? remoteSocketId.slice(0, 6) + "…" : remoteSocketId;
          log("WebRTC: conexión fallida con peer " + remoteSocketId + " (ICE: " + pc.iceConnectionState + ")");
          setMediaStatus(
            "Fallo la conexión con un participante (" +
              short +
              "). Puedes pulsar «Reintentar enlace» en su tarjeta o «Reiniciar cámara y mic»."
          );
          setTimeout(() => {
            if (pcs.has(remoteSocketId) && pcs.get(remoteSocketId)?.connectionState === "failed") {
              teardownPeerPcOnly(remoteSocketId);
            }
          }, 1400);
        }
      };
      pc.addEventListener("connectionstatechange", onPcState);
      pc.addEventListener("iceconnectionstatechange", onPcState);
      pc._peerStatusHandler = onPcState;
      onPcState();

      pcs.set(remoteSocketId, pc);
      updateLocalAggregateStatus();
      return pc;
    }

    function getOrCreatePc(remoteSocketId) {
      const existing = pcs.get(remoteSocketId);
      if (existing && !peerConnectionIsDead(existing)) {
        return existing;
      }
      if (existing && peerConnectionIsDead(existing)) {
        teardownPeerPcOnly(remoteSocketId);
      }
      ensureRemotePeerUi(remoteSocketId);
      return attachNewPeerConnection(remoteSocketId);
    }

    async function flushPendingIce(pc) {
      while (pc._pendingIce?.length) {
        const c = pc._pendingIce.shift();
        try {
          await pc.addIceCandidate(new RTCIceCandidate(c));
        } catch (err) { console.warn("addIceCandidate", err); }
      }
    }

    function cleanupPeer(remoteSocketId) {
      teardownPeerPcOnly(remoteSocketId);
      const vid = remoteVideos.get(remoteSocketId);
      if (vid) {
        vid.srcObject = null;
        vid.parentElement?.remove();
        remoteVideos.delete(remoteSocketId);
      }
      peerStatusEls.delete(remoteSocketId);
      updateLocalAggregateStatus();
    }

    async function negotiateOffer(remoteSocketId) {
      const pc = getOrCreatePc(remoteSocketId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit("webrtc:offer", {
        roomId: activeRoomId,
        sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp },
        targetSocketId: remoteSocketId,
      });
      updatePeerStatus(remoteSocketId);
      updateLocalAggregateStatus();
    }

    async function retryPeerRenegotiate(remoteSocketId) {
      if (!activeRoomId || !socket?.connected) return;
      log("Renegociando WebRTC con peer " + remoteSocketId);
      setMediaStatus("Renegociando enlace (nueva oferta)…");
      teardownPeerPcOnly(remoteSocketId);
      ensureRemotePeerUi(remoteSocketId);
      try {
        await negotiateOffer(remoteSocketId);
        setMediaStatus("Oferta enviada. Esperando respuesta del otro extremo.");
      } catch (e) {
        console.error(e);
        log("Renegociación: " + (e?.message || e));
        setMediaStatus("No se pudo renegociar. Prueba de nuevo o recarga la página.");
      }
    }

    async function onIncomingOffer(fromSocketId, sdp) {
      let pc = pcs.get(fromSocketId);
      if (!pc || peerConnectionIsDead(pc)) {
        pc = getOrCreatePc(fromSocketId);
      }
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      } catch (e) {
        console.warn("setRemoteDescription(offer), reintentando con PC nueva", e);
        teardownPeerPcOnly(fromSocketId);
        pc = getOrCreatePc(fromSocketId);
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      }
      await flushPendingIce(pc);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit("webrtc:answer", {
        roomId: activeRoomId,
        sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp },
        targetSocketId: fromSocketId,
      });
      updatePeerStatus(fromSocketId);
      updateLocalAggregateStatus();
    }

    async function onIncomingAnswer(fromSocketId, sdp) {
      const pc = pcs.get(fromSocketId);
      if (!pc || peerConnectionIsDead(pc)) return;
      if (pc.signalingState !== "have-local-offer") return;
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      } catch (e) {
        console.warn("setRemoteDescription(answer) ignorada", e);
        return;
      }
      await flushPendingIce(pc);
      updatePeerStatus(fromSocketId);
      updateLocalAggregateStatus();
    }

    async function onIncomingIce(fromSocketId, candidate) {
      const pc = getOrCreatePc(fromSocketId);
      if (!candidate) return;
      if (!pc.remoteDescription) {
        pc._pendingIce.push(candidate);
        return;
      }
      try {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (err) {
        console.warn("ICE", err);
      }
      updatePeerStatus(fromSocketId);
      updateLocalAggregateStatus();
    }

    function drawBoard() {
      const canvas = $("board");
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const els = boardState.elementos || [];
      for (const el of els) {
        if (el.type === "stroke" && el.points?.length) {
          ctx.strokeStyle = el.color || "#111";
          ctx.lineWidth = el.lineWidth || 2;
          ctx.beginPath();
          ctx.moveTo(el.points[0].x, el.points[0].y);
          for (let i = 1; i < el.points.length; i++) {
            ctx.lineTo(el.points[i].x, el.points[i].y);
          }
          ctx.stroke();
        }
      }
    }

    function mergeBoardContenido(contenido) {
      if (contenido && Array.isArray(contenido.elementos)) {
        boardState = { elementos: [...contenido.elementos] };
      }
      drawBoard();
    }

    function emitBoardUpdate() {
      if (!activeRoomId || !socket) return;
      socket.emit("board:update", { roomId: activeRoomId, contenido: boardState });
    }

    function appendChatLine(payload) {
      const m = payload.mensaje;
      if (!m) return;
      const box = $("chatBox");
      const div = document.createElement("div");
      const autor = m.autor?.nombre || m.autor?.usuarioId || "?";
      const tipo = m.tipo === "privado" ? " (privado)" : "";
      div.className = m.tipo === "privado" ? "msg-privado" : "";
      div.textContent = `[${new Date(m.marcaTiempo || Date.now()).toLocaleTimeString()}] ${autor}${tipo}: ${m.contenido}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function connectSocketIfNeeded() {
      const token = getToken();
      if (!token) throw new Error("Sin token");
      if (socket?.connected) return Promise.resolve(socket);
      return new Promise((resolve, reject) => {
        socket = io({ auth: { token }, transports: ["websocket", "polling"] });
        socket.on("connect", () => resolve(socket));
        socket.on("connect_error", (e) => {
          const msg =
            String(e?.message || "").includes("UNAUTHORIZED") || e?.data === "UNAUTHORIZED"
              ? "Sesión inválida o caducada. Vuelve a iniciar sesión."
              : "No se pudo conectar al servidor: " + (e?.message || "error");
          log(msg);
          reject(new Error(msg));
        });
        socket.on("chat:message", appendChatLine);
        socket.on("board:state", (d) => mergeBoardContenido(d.contenido));
        socket.on("board:update", (d) => mergeBoardContenido(d.contenido));
        socket.on("webrtc:offer", async ({ sdp, from }) => {
          try {
            await onIncomingOffer(from, sdp);
          } catch (e) { console.error(e); log("Error offer: " + e.message); }
        });
        socket.on("webrtc:answer", async ({ sdp, from }) => {
          try {
            await onIncomingAnswer(from, sdp);
          } catch (e) { console.error(e); }
        });
        socket.on("webrtc:ice-candidate", async ({ candidate, from }) => {
          try {
            await onIncomingIce(from, candidate);
          } catch (e) { console.warn(e); }
        });
        socket.on("presence:leave", ({ socketId }) => {
          if (socketId) cleanupPeer(socketId);
        });
      });
    }

    async function enterRoom() {
      const roomId = $("roomIdInput").value.trim();
      if (!roomId) {
        log("Indica un Room ID");
        return;
      }
      setMediaStatus("Preparando cámara y micrófono…");
      log("Entrando en la sala…");
      try {
        await loadIce();
        await ensureLocalStream();
        await connectSocketIfNeeded();
      } catch (e) {
        const msg = e?.name === "NotAllowedError" || e?.message?.includes("Permiso")
          ? humanizeGetUserMediaError(e)
          : e?.message || "Error al preparar la reunión";
        log(msg);
        setMediaStatus(msg);
        stopLocalMedia();
        return;
      }

      try {
        await new Promise((resolve, reject) => {
          socket.emit("room:join", { roomId }, async (resp) => {
            if (!resp?.ok) {
              const errMsg =
                resp?.error === "No eres participante de esta reunión"
                  ? "No estás en la lista de la reunión. Pulsa «Unirse (API)» con el Room ID correcto."
                  : resp?.error || "No se pudo unir a la sala (Socket)";
              log(errMsg);
              setMediaStatus(errMsg);
              reject(new Error(errMsg));
              return;
            }
            activeRoomId = roomId;
            $("activeRoomLabel").textContent = roomId;
            showRoom();
            setMediaStatus("En reunión. " + (resp.peers?.length ? resp.peers.length + " participante(s) ya en la sala." : "Eres el primero en la sala."));
            log("En sala. Peers: " + JSON.stringify(resp.peers));
            const peers = resp.peers || [];
            for (const p of peers) {
              try {
                await negotiateOffer(p.socketId);
              } catch (e) {
                console.error(e);
                log("Error al negociar con un peer: " + (e?.message || e));
              }
            }
            syncMediaButtons();
            updateLocalAggregateStatus();
            resolve();
          });
        });
      } catch {
        stopLocalMedia();
      }
    }

    function leaveRoom() {
      const room = activeRoomId;
      if (socket && room) {
        try {
          socket.emit("room:leave", { roomId: room });
        } catch (_) {}
      }
      activeRoomId = null;
      for (const id of [...pcs.keys()]) cleanupPeer(id);
      stopLocalMedia();
      drawing = false;
      currentStroke = null;
      boardState = { elementos: [] };
      drawBoard();
      $("remotesContainer").innerHTML = "";
      $("chatBox").innerHTML = "";
      $("roomSection").classList.add("hidden");
      setMediaStatus("");
      const lc = $("localConnStatus");
      if (lc) lc.textContent = "";
      log("Saliste de la reunión. Cámara, micrófono y conexiones WebRTC liberados.");
    }

    $("chatTipo").addEventListener("change", () => {
      const priv = $("chatTipo").value === "privado";
      $("destinatarioId").classList.toggle("hidden", !priv);
    });

    $("btnLogin").addEventListener("click", async () => {
      try {
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: $("email").value.trim(),
            password: $("password").value,
          }),
        });
        setToken(data.token);
        $("userLabel").textContent = data.usuario.nombre + " (" + data.usuario.rol + ")";
        log("Sesión iniciada");
        showLobby();
      } catch (e) {
        log("Login: " + e.message);
      }
    });

    $("btnRegister").addEventListener("click", async () => {
      try {
        const data = await api("/api/auth/register", {
          method: "POST",
          body: JSON.stringify({
            nombre: $("nombre").value.trim() || $("email").value.split("@")[0],
            email: $("email").value.trim(),
            password: $("password").value,
            rol: $("rolRegistro").value,
          }),
        });
        setToken(data.token);
        $("userLabel").textContent = data.usuario.nombre + " (" + data.usuario.rol + ")";
        log("Cuenta creada");
        showLobby();
      } catch (e) {
        log("Registro: " + e.message);
      }
    });

    $("btnLogout").addEventListener("click", () => {
      leaveRoom();
      if (socket) {
        socket.disconnect();
        socket = null;
      }
      setToken(null);
      showAuth();
      log("Sesión cerrada");
    });

    $("btnCrearReunion").addEventListener("click", async () => {
      try {
        const data = await api("/api/reuniones", {
          method: "POST",
          body: JSON.stringify({ titulo: "Clase " + new Date().toLocaleString() }),
        });
        const rid = data.reunion.roomId;
        $("roomIdInput").value = rid;
        $("crearResult").textContent = "Creada. room_id: " + rid;
        log("Reunión creada. Copia el Room ID para los estudiantes.");
      } catch (e) {
        log("Crear reunión: " + e.message);
      }
    });

    $("btnUnirseApi").addEventListener("click", async () => {
      const roomId = $("roomIdInput").value.trim();
      if (!roomId) return log("Pega un Room ID");
      try {
        await api("/api/reuniones/room/" + encodeURIComponent(roomId) + "/unirse", { method: "POST", body: "{}" });
        log("Unido vía API. Pulsa «Entrar a la sala» para Socket/WebRTC.");
        $("cupoInfo").textContent = "";
      } catch (e) {
        log("Unirse API: " + e.message);
      }
    });

    $("btnConsultarCupo").addEventListener("click", async () => {
      const roomId = $("roomIdInput").value.trim();
      if (!roomId) return log("Pega un Room ID");
      try {
        const data = await api("/api/reuniones/room/" + encodeURIComponent(roomId));
        const c = data.cupo;
        $("cupoInfo").textContent =
          c != null
            ? `En sala: ${c.participantes}/${c.maxTotal} personas (${c.estudiantes}/${c.maxEstudiantes} plazas de estudiante).`
            : "";
        log("Cupo consultado.");
      } catch (e) {
        $("cupoInfo").textContent = "";
        log("Consultar cupo: " + e.message);
      }
    });

    $("btnToggleMic").addEventListener("click", () => {
      if (!localStream) return;
      const t = localStream.getAudioTracks()[0];
      if (!t) return;
      setMicEnabled(!t.enabled);
    });
    $("btnToggleCam").addEventListener("click", () => {
      if (!localStream) return;
      const t = localStream.getVideoTracks()[0];
      if (!t) return;
      setCamEnabled(!t.enabled);
    });

    $("btnReiniciarMedios").addEventListener("click", () => {
      reiniciarMediosEnReunion().catch((e) => console.error(e));
    });

    $("btnEntrarSala").addEventListener("click", () => enterRoom().catch(() => {}));
    $("btnSalirSala").addEventListener("click", () => leaveRoom());

    $("btnEnviarChat").addEventListener("click", () => {
      const contenido = $("chatInput").value.trim();
      if (!contenido || !activeRoomId || !socket) return;
      const tipo = $("chatTipo").value;
      const payload = { roomId: activeRoomId, contenido, tipo };
      if (tipo === "privado") {
        const d = $("destinatarioId").value.trim();
        if (d) payload.destinatarioUsuarioId = d;
      }
      socket.emit("chat:message", payload, (r) => {
        if (r && !r.ok) log("Chat: " + (r.error || "error"));
      });
      $("chatInput").value = "";
    });

    const canvas = $("board");
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    function canvasPoint(e) {
      const r = canvas.getBoundingClientRect();
      const scaleX = canvas.width / r.width;
      const scaleY = canvas.height / r.height;
      return { x: (e.clientX - r.left) * scaleX, y: (e.clientY - r.top) * scaleY };
    }

    function drawBoardWithPreview(previewStroke) {
      drawBoard();
      if (!previewStroke?.points?.length) return;
      const c = $("board").getContext("2d");
      c.strokeStyle = previewStroke.color || "#111";
      c.lineWidth = previewStroke.lineWidth || 2;
      c.beginPath();
      c.moveTo(previewStroke.points[0].x, previewStroke.points[0].y);
      for (let i = 1; i < previewStroke.points.length; i++) {
        c.lineTo(previewStroke.points[i].x, previewStroke.points[i].y);
      }
      c.stroke();
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (!activeRoomId) return;
      canvas.setPointerCapture(e.pointerId);
      drawing = true;
      const p = canvasPoint(e);
      currentStroke = { type: "stroke", points: [p], color: "#111", lineWidth: 2 };
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!drawing || !currentStroke) return;
      currentStroke.points.push(canvasPoint(e));
      drawBoardWithPreview(currentStroke);
    });
    function endStroke(e) {
      if (!drawing) return;
      drawing = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      if (!currentStroke || !activeRoomId) return;
      currentStroke.points.push(canvasPoint(e));
      boardState.elementos = [...(boardState.elementos || []), { ...currentStroke, points: [...currentStroke.points] }];
      currentStroke = null;
      drawBoard();
      emitBoardUpdate();
    }
    canvas.addEventListener("pointerup", endStroke);
    canvas.addEventListener("pointercancel", endStroke);

    window.addEventListener("pagehide", () => {
      const room = activeRoomId;
      if (socket?.connected && room) {
        try {
          socket.emit("room:leave", { roomId: room });
        } catch (_) {}
      }
      if (localStream) {
        localStream.getTracks().forEach((t) => {
          try {
            t.stop();
          } catch (_) {}
        });
        localStream = null;
      }
    });

    (async function init() {
      await loadIce();
      if (getToken()) {
        try {
          const me = await api("/api/usuarios/me");
          $("userLabel").textContent = me.usuario.nombre + " (" + me.usuario.rol + ")";
          showLobby();
          log("Sesión restaurada");
        } catch {
          setToken(null);
          showAuth();
        }
      } else {
        showAuth();
      }
    })();
  </script>
</body>
</html>
